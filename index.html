  };
}

function validateExperiment(exp) {
  const errs = [];
  if (!exp || typeof exp !== 'object') return ['JSON 根节点必须为对象'];
  if (!exp.id || !/^[a-zA-Z0-9_-]+$/.test(exp.id)) errs.push('id');
  if (!exp.title || !exp.title.zh) errs.push('title.zh');
  if (!exp.title || !exp.title.en) errs.push('title.en');
  if (!Array.isArray(exp.inputs) || !exp.inputs.length) errs.push('inputs');
  if (!Array.isArray(exp.derived) || !exp.derived.length) errs.push('derived');
  if (!Array.isArray(exp.checks)) errs.push('checks');
  if (Array.isArray(exp.inputs)) {
    const seen = {};
    exp.inputs.forEach((i) => {
      if (!i.key) errs.push('inputs.key');
      else if (seen[i.key]) errs.push('duplicate input key: ' + i.key);
      else seen[i.key] = true;
      if (i.value === undefined) errs.push('inputs.value: ' + i.key);
    });
  }
  if (Array.isArray(exp.derived)) {
    exp.derived.forEach((d) => {
      if (!d.key || !d.expr) { errs.push('derived.key/expr'); return; }
      try { compile(d.expr); } catch (e) { errs.push('expr error (' + d.key + '): ' + e.message); }
    });
  }
  return errs;
}

function openEditor(exp) {
  const draft = exp ? clone(exp) : blankExperiment();
  state.editingId = exp && !isBuiltin(exp.id) ? exp.id : (exp ? exp.id : null);
  state.editor = { draft, tab: 'form', jsonText: JSON.stringify(draft, null, 2), error: '' };
  state.libraryTab = 'edit';
  render();
}
function syncDraftFromJson() {
  try {
    const parsed = JSON.parse(state.editor.jsonText);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('bad root');
    state.editor.draft = parsed;
    state.editor.error = '';
    return true;
  } catch (e) {
    state.editor.error = t('library.importFail') + ' · ' + e.message;
    return false;
  }
}
function saveTemplate() {
  let draft = state.editor.draft;
  if (state.editor.tab === 'json') {
    if (!syncDraftFromJson()) return render();
    draft = state.editor.draft;
  }
  const errs = validateExperiment(draft);
  if (errs.length) {
    state.editor.error = t('library.validateFail') + ' · ' + errs.slice(0, 4).join('; ');
    render();
    return;
  }
  const test = computeExperiment(draft, (draft.inputs || []).reduce((o, i) => { o[i.key] = i.value; return o; }, {}));
  const broken = test.results.filter((r) => !r.ok);
  draft.enabled = true;
  draft.id = draft.id || ('custom-' + Date.now().toString(36));
  const idx = state.customExperiments.findIndex((e) => e.id === draft.id);
  if (idx >= 0) state.customExperiments[idx] = draft;
  else state.customExperiments.push(draft);
  state.editor = null;
  state.libraryTab = 'list';
  persist();
  render();
  toast(t('library.saved') + (broken.length ? ' · ' + broken.length + ' derived value(s) unresolved' : ''), broken.length ? 'warn' : 'ok');
}

function importTemplates(json) {
  try {
    const parsed = JSON.parse(json);
    const arr = Array.isArray(parsed) ? parsed : [parsed];
    let count = 0;
    arr.forEach((item) => {
      const errs = validateExperiment(item);
      if (!errs.length) {
        const idx = state.customExperiments.findIndex((e) => e.id === item.id);
        if (idx >= 0) state.customExperiments[idx] = item;
        else state.customExperiments.push(item);
        count++;
      }
    });
    if (!count) throw new Error('no valid template');
    persist();
    render();
    toast(t('library.imported') + ' · ' + count, 'ok');
  } catch (e) {
    toast(t('library.importFail'), 'err');
  }
}

// ---------- 自检 ----------
function selfTest() {
  const val = (exp, values) => computeExperiment(exp, values);
  const results = [];
  const gExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'pendulum');
  const gRes = val(gExp, { L: 0.85, t: 18.62, n: 10, dT: 0.01, gRef: 9.79 });
  results.push(['pendulum g ≈ 9.679', Math.abs(gRes.scope.g - 9.679) < 0.005, gRes.scope.g]);
  results.push(['pendulum T ≈ 1.862', Math.abs(gRes.scope.T - 1.862) < 1e-6, gRes.scope.T]);

  const amExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'am');
  const amRes = val(amExp, { Vmax: 1.8, Vmin: 0.2, F: 1, mRef: 0.8 });
  results.push(['AM ma ≈ 0.8', Math.abs(amRes.scope.ma - 0.8) < 1e-9, amRes.scope.ma]);
  results.push(['AM efficiency ≈ 24.24%', Math.abs(amRes.scope.eta - 24.2424) < 0.01, amRes.scope.eta]);

  const pcmExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'pcm');
  const pcmRes = val(pcmExp, { fm: 3.4, fs: 8, N: 8, ch: 30 });
  results.push(['PCM SNR ≈ 49.92 dB', Math.abs(pcmRes.scope.snr - 49.92) < 0.01, pcmRes.scope.snr]);
  results.push(['PCM bit rate = 64 kbit/s', Math.abs(pcmRes.scope.Rb - 64) < 1e-9, pcmRes.scope.Rb]);

  const nrExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'newton-ring');
  const nrRes = val(nrExp, { lambda: 589.3, Dm: 7.2, m: 15, Dn: 4.0, n: 5, Rref: 1.5 });
  results.push(['Newton ring R ≈ 1.520 m', Math.abs(nrRes.scope.R - 1.5203) < 0.002, nrRes.scope.R]);

  const usExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'ultrasonic');
  const usRes = val(usExp, { f: 40000, x1: 10, x2: 14.3, x3: 18.6, x4: 22.9, x5: 27.2, vRef: 343 });
  results.push(['Ultrasonic v ≈ 344 m/s', Math.abs(usRes.scope.v - 344) < 0.01, usRes.scope.v]);

  const hallExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'hall');
  const hallRes = val(hallExp, { VH: 15, VHr: -14.6, IS: 5, KH: 20, Bref: 0.15 });
  results.push(['Hall B ≈ 0.148 T', Math.abs(hallRes.scope.B - 0.148) < 0.002, hallRes.scope.B]);

  const strExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'string-wave');
  const strRes = val(strExp, { mu: 1.2, T: 1.96, L: 0.6, n: 3, f: 101 });
  results.push(['String f_th ≈ 101.04 Hz', Math.abs(strRes.scope.fTheory - 101.036) < 0.05, strRes.scope.fTheory]);

  const eyeExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'eye');
  const eyeRes = val(eyeExp, { rb: 2.048, Vpp: 2, Veye: 1.2, sigma: 0.08 });
  results.push(['Eye opening = 60%', Math.abs(eyeRes.scope.open - 60) < 1e-9, eyeRes.scope.open]);
  results.push(['Eye Tb ≈ 0.4883 µs', Math.abs(eyeRes.scope.Tb - 0.48828) < 0.001, eyeRes.scope.Tb]);

  const wheatExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'wheatstone');
  const wheatRes = val(wheatExp, { Rs: 1000, k: 0.1, Rref: 100 });
  results.push(['Wheatstone Rx = 100 Ω', Math.abs(wheatRes.scope.Rx - 100) < 1e-9, wheatRes.scope.Rx]);

  const rlcExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'rlc');
  const rlcRes = val(rlcExp, { L: 10, C: 100, R: 20, f1: 4875, f2: 5190 });
  results.push(['RLC f0 ≈ 5032.9 Hz', Math.abs(rlcRes.scope.f0 - 5032.92) < 0.2, rlcRes.scope.f0]);
  results.push(['RLC Q ≈ 15.98', Math.abs(rlcRes.scope.Q - 15.978) < 0.02, rlcRes.scope.Q]);

  const lensExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'lens-focal');
  const lensRes = val(lensExp, { D: 90, d: 30, fRef: 20 });
  results.push(['Lens f = 20 cm', Math.abs(lensRes.scope.f - 20) < 1e-9, lensRes.scope.f]);

  const micExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'michelson');
  const micRes = val(micExp, { d1: 10, d2: 10.1898, N: 600, lambdaRef: 632.8 });
  results.push(['Michelson λ ≈ 632.67 nm', Math.abs(micRes.scope.lambda - 632.6667) < 0.01, micRes.scope.lambda]);

  const inExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'inertia');
  const inRes = val(inExp, { m0: 0.5, m1: 0.3, R: 0.1, r: 0.05, H: 0.5, T0: 1.2, T1: 2.02, Dring: 0.3, dring: 0.28 });
  results.push(['Inertia I1 ≈ I_th', Math.abs(inRes.scope.I1 - inRes.scope.Ith) < 1e-5, inRes.scope.I1]);

  const yExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'young');
  const yRes = val(yExp, { D: 1.5, L: 1, d: 0.5, K: 0.08, l: 0.028, F: 29.4, Yref: 2e11 });
  results.push(['Young Y ≈ 2.005e11 Pa', Math.abs(yRes.scope.Y - 2.0054e11) / 2e11 < 0.005, yRes.scope.Y]);

  const spExp = BUILTIN_EXPERIMENTS.find((e) => e.id === 'spectrometer');
  const spRes = val(spExp, { A: 60, dmin: 51.5, lambda: 589.3, nRef: 1.65 });
  results.push(['Spectrometer n ≈ 1.654', Math.abs(spRes.scope.n - 1.65398) < 0.002, spRes.scope.n]);

  const fail = results.filter((r) => !r[1]);
  if (window.console) {
    console.table(results.map((r) => ({ case: r[0], pass: r[1], value: r[2] })));
    console.log('[Lab Copilot] self-test: ' + (results.length - fail.length) + '/' + results.length + ' passed');
  }
  return { total: results.length, passed: results.length - fail.length, results };
}

// ---------- 事件绑定 ----------
function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-nav],[data-set-lang],[data-select-exp],[data-open-exp],[data-filter-cat],[data-step-go],[data-back],[data-next],[data-open-camera],[data-open-album],[data-demo-image],[data-recognize],[data-try-reocr],[data-manual-mode],[data-toggle-formula],[data-recalc],[data-rerun-checks],[data-apply-fix],[data-export],[data-edit-meta],[data-lib-new],[data-lib-edit],[data-lib-dup],[data-lib-del],[data-lib-export],[data-lib-reset],[data-lib-import],[data-lib-tab],[data-lib-save],[data-lib-cancel],[data-tpl-upload],[data-tpl-pick],[data-tpl-drop],[data-tpl-activate],[data-tpl-history],[data-tpl-restore],[data-tpl-rename],[data-tpl-del],[data-tpl-dup],[data-tpl-save],[data-tpl-edit],[data-sec-up],[data-sec-down],[data-imp-open],[data-imp-pick],[data-imp-drop],[data-imp-blank],[data-imp-save],[data-close-modal]');
    if (!el) return;

    if (el.dataset.closeModal !== undefined) {
      if (el.classList.contains('modal-mask') && e.target !== el) return;
      closeModal();
      return;
    }
    if (el.dataset.nav) return goView(el.dataset.nav);
    if (el.dataset.setLang) return setLang(el.dataset.setLang);
    if (el.dataset.selectExp) return selectExperiment(el.dataset.selectExp, 1);
    if (el.dataset.openExp) return selectExperiment(el.dataset.openExp, 2);
    if (el.dataset.filterCat) {
      state.filters.cat = el.dataset.filterCat;
      render({ keepScroll: true });
      return;
    }
    if (el.dataset.stepGo) return goStep(el.dataset.stepGo);
    if (el.dataset.back) return stepBack(el.dataset.back);
    if (el.dataset.next) return stepForward();
    if (el.dataset.openCamera !== undefined) { const f = $('#fileCamera'); if (f) f.click(); return; }
    if (el.dataset.openAlbum !== undefined) { const f = $('#fileAlbum'); if (f) f.click(); return; }
    if (el.dataset.demoImage !== undefined) return generateDemoImage();
    if (el.dataset.recognize !== undefined) return startOcr();
    if (el.dataset.tryReocr !== undefined) return startOcr();
    if (el.dataset.manualMode !== undefined) {
      if (!state.experimentId) return;
      state.ocr.manualMode = true;
      state.ocr.recognized = false;
      render({ keepScroll: true });
      return;
    }
    if (el.dataset.toggleFormula) {
      const k = el.dataset.toggleFormula;
      state.ui.formulaOpen[k] = !state.ui.formulaOpen[k];
      render({ keepScroll: true });
      return;
    }
    if (el.dataset.recalc !== undefined) {
      refreshLive();
      toast(t('calc.autoSaved'), 'ok');
      return;
    }
    if (el.dataset.rerunChecks !== undefined) {
      render({ keepScroll: true });
      toast(t('check.allPass'), 'ok');
      return;
    }
    if (el.dataset.applyFix !== undefined) {
      let fix = null;
      try { fix = JSON.parse(el.dataset.fix || 'null'); } catch (err) { fix = null; }
      if (!fix) return;
      const before = state.values[fix.key] !== undefined ? state.values[fix.key] : '—';
      const msg = t('check.fixConfirm') + '  ' + fix.key + ': ' + before + ' → ' + roundTo(fix.value, 8) + (fix.note ? ' (' + fix.note + ')' : '');
      return confirmDialog(msg, t('check.fix'), () => {
        updateValue(fix.key, String(roundTo(fix.value, 6)), false);
        render({ keepScroll: true });
        toast(t('check.fixed'), 'ok');
      });
    }
    if (el.dataset.export) return exportReport(el.dataset.export);
    if (el.dataset.editMeta !== undefined) return openMetaModal();

    if (el.dataset.libNew !== undefined) return openEditor(null);
    if (el.dataset.libEdit) {
      const exp = allExperiments().find((x) => x.id === el.dataset.libEdit);
      if (exp) openEditor(exp);
      return;
    }
    if (el.dataset.libDup) {
      const exp = allExperiments().find((x) => x.id === el.dataset.libDup);
      if (!exp) return;
      const cp = clone(exp);
      cp.id = exp.id + '-copy-' + Math.random().toString(36).slice(2, 5);
      cp.title = { zh: exp.title.zh + '（' + t('library.dupSuffix') + '）', en: exp.title.en + ' (copy)' };
      cp.enabled = true;
      state.customExperiments.push(cp);
      persist(); render();
      toast(t('library.saved'), 'ok');
      return;
    }
    if (el.dataset.libDel) {
      const exp = allExperiments().find((x) => x.id === el.dataset.libDel);
      if (!exp) return;
      return confirmDialog(fill(t('library.deleteConfirm'), { name: L(exp.title) }), t('common.delete'), () => {
        state.customExperiments = state.customExperiments.filter((x) => x.id !== exp.id);
        if (state.experimentId === exp.id) state.experimentId = null;
        persist(); render();
        toast(t('library.deleted'), 'ok');
      });
    }
    if (el.dataset.libExport !== undefined) {
      const all = allExperiments();
      download('lab-copilot-templates-' + nowStamp() + '.json', JSON.stringify(all, null, 2), 'application/json');
      toast(t('report.downloadOk'), 'ok');
      return;
    }
    if (el.dataset.libReset !== undefined) {
      return confirmDialog(t('library.resetConfirm'), t('library.reset'), () => {
        state.customExperiments = [];
        state.experimentId = null;
        persist(); render();
        toast(t('library.reset'), 'ok');
      });
    }
    if (el.dataset.libImport !== undefined) { const f = $('#importFile'); if (f) f.click(); return; }
    if (el.dataset.libTab) {
      const target = el.dataset.libTab;
      if (target === 'json') {
        state.editor.jsonText = JSON.stringify(state.editor.draft, null, 2);
        state.editor.tab = 'json';
        state.editor.error = '';
      } else {
        const ok = syncDraftFromJson();
        if (!ok) return render();
        state.editor.tab = 'form';
      }
      render();
      return;
    }
    if (el.dataset.libSave !== undefined) return saveTemplate();
    if (el.dataset.tplUpload !== undefined) return openTplUpload();
    if (el.dataset.tplPick !== undefined || el.dataset.tplDrop !== undefined) { const f = $('#tplFile'); if (f) f.click(); return; }
    if (el.dataset.tplActivate) {
      state.activeTemplateId = el.dataset.tplActivate;
      persist(); render(); toast(t('tpl.saved'), 'ok');
      return;
    }
    if (el.dataset.tplHistory) return openTemplateHistory(el.dataset.tplHistory);
    if (el.dataset.tplRestore !== undefined) {
      const id = state.historyTplId;
      const tpl = state.templates.find((x) => x.id === id);
      const hist = state.templateVersions[id] || [];
      const v = hist[Number(el.dataset.tplRestore)];
      if (tpl && v) {
        pushTemplateVersion(id, tpl);
        tpl.sections = clone(v.sections);
        tpl.name = clone(v.name);
        tpl.lang = v.lang;
        tpl.appliesTo = v.appliesTo;
        tpl.updated = nowStamp();
        persist(); closeModal(); render(); toast(t('tpl.saved'), 'ok');
      }
      return;
    }
    if (el.dataset.tplEdit) return openTplEditor(el.dataset.tplEdit);
    if (el.dataset.tplRename) {
      const tpl = state.templates.find((x) => x.id === el.dataset.tplRename);
      if (!tpl) return;
      const name = window.prompt(t('tpl.renamePrompt'), L(tpl.name));
      if (name && name.trim()) {
        pushTemplateVersion(tpl.id, tpl);
        tpl.name = { zh: name.trim(), en: name.trim() };
        tpl.updated = nowStamp();
        persist(); render(); toast(t('tpl.saved'), 'ok');
      }
      return;
    }
    if (el.dataset.tplDel) {
      const tpl = state.templates.find((x) => x.id === el.dataset.tplDel);
      if (!tpl) return;
      return confirmDialog(fill(t('tpl.deleteConfirm'), { name: L(tpl.name) }), t('common.delete'), () => {
        state.templates = state.templates.filter((x) => x.id !== tpl.id);
        delete state.templateVersions[tpl.id];
        if (state.activeTemplateId === tpl.id) state.activeTemplateId = 'tpl-cn-standard';
        persist(); render(); toast(t('library.deleted'), 'ok');
      });
    }
    if (el.dataset.tplDup) return duplicateTemplate(el.dataset.tplDup);
    if (el.dataset.tplSave !== undefined) return savePendingTemplate();
    if (el.dataset.secUp !== undefined) return movePendingSection(Number(el.dataset.secUp), -1);
    if (el.dataset.secDown !== undefined) return movePendingSection(Number(el.dataset.secDown), 1);
    if (el.dataset.impOpen !== undefined) return openExperimentImport();
    if (el.dataset.impPick !== undefined || el.dataset.impDrop !== undefined) { const f = $('#impFile'); if (f) f.click(); return; }
    if (el.dataset.impBlank !== undefined) {
      state.pendingImport = blankImportDraft();
      state.pendingImport.title.zh = '';
      openModal(renderImpModal());
      return;
    }
    if (el.dataset.impSave !== undefined) return saveImportedExperiment();
    if (el.dataset.libCancel !== undefined) {
      state.editor = null;
      state.libraryTab = 'list';
      render();
      return;
    }
  });

  // 输入
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'expSearch') {
      state.filters.q = el.value;
      const grid = $('#expGrid');
      if (grid) {
        const q = el.value.trim().toLowerCase();
        const list = allExperiments().filter((x) => {
          if (state.filters.cat !== 'all' && x.category !== state.filters.cat) return false;
          if (!q) return true;
          return [x.id, x.title.zh, x.title.en, x.short && x.short.zh, x.short && x.short.en].join(' ').toLowerCase().indexOf(q) >= 0;
        });
        grid.innerHTML = list.length ? list.map(renderExpCard).join('') : '<div class="empty-state" style="grid-column:1/-1"><h4>' + esc(t('exp.empty')) + '</h4></div>';
      }
      return;
    }
    if (el.dataset.calcInput) { updateValue(el.dataset.calcInput, el.value, true); return; }
    if (el.dataset.manualInput) { updateValue(el.dataset.manualInput, el.value, false); return; }
    if (el.dataset.ocrInput) {
      const key = el.dataset.ocrInput;
      updateValue(key, el.value, false);
      const cell = state.ocr.cells.find((c) => c.key === key);
      if (cell) { cell.raw = el.value; cell.value = Number(el.value); cell.confidence = 1; cell.status = 'ok'; }
      const row = el.closest('tr');
      if (row) {
        el.classList.remove('low');
        const conf = row.querySelector('.conf');
        if (conf) { conf.className = 'conf high'; const bar = conf.querySelector('i'); if (bar) bar.style.width = '100%'; const b = conf.querySelector('b'); if (b) b.textContent = '100%'; }
        const badge = row.querySelector('.badge-sm');
        if (badge) { badge.className = 'badge-sm ok'; badge.textContent = t('upload.verified'); }
      }
      return;
    }
    if (el.dataset.metaField) { state.meta[el.dataset.metaField] = el.value; return; }
    if (el.dataset.field) {
      const path = el.dataset.field;
      const d = state.editor.draft;
      if (path === 'aims.zh' || path === 'aims.en') {
        const langKey = path.split('.')[1];
        d.aims = d.aims || {};
        d.aims[langKey] = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
      } else if (path === 'formulas') {
        d.formulas = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
      } else if (path === 'title.zh' || path === 'title.en') {
        const k = path.split('.')[1];
        d.title = d.title || {};
        d.title[k] = el.value;
      } else if (path === 'id') {
        d.id = el.value.replace(/\s+/g, '-');
      } else {
        d[path] = el.value;
      }
      state.editor.jsonText = JSON.stringify(d, null, 2);
      return;
    }
    if (el.dataset.pendingName !== undefined) {
      if (state.pendingTemplate) state.pendingTemplate.name = el.value;
      return;
    }
    if (el.dataset.pendingColumns !== undefined) {
      if (state.pendingTemplate) state.pendingTemplate.tableColumns = Number(el.value) || 0;
      return;
    }
    if (el.dataset.secTitle !== undefined) {
      const p = state.pendingTemplate;
      if (!p) return;
      const s = p.sections[Number(el.dataset.secTitle)];
      if (s) s.title = { zh: el.value, en: el.value };
      return;
    }
    if (el.dataset.impField) {
      const p = state.pendingImport;
      if (!p) return;
      const f = el.dataset.impField;
      if (f === 'title.zh' || f === 'title.en') { p.title[f.split('.')[1]] = el.value; return; }
      if (/^(aims|instr|steps)(Zh|En)$/.test(f)) {
        p[f] = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
        return;
      }
      if (f === 'formulas') { p.formulas = el.value.split('\n').map((s) => s.trim()).filter(Boolean); return; }
      p[f] = el.value;
      return;
    }
    if (el.id === 'jsonEditor') {
      state.editor.jsonText = el.value;
      return;
    }
    if (el.dataset.field && el.tagName === 'SELECT') {
      const d = state.editor.draft;
      d[el.dataset.field] = el.value;
      state.editor.jsonText = JSON.stringify(d, null, 2);
      return;
    }
  });

  // 文件选择
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'tplFile') {
      const f = el.files && el.files[0];
      if (f) handleTplFile(f);
      el.value = '';
      return;
    }
    if (el.id === 'impFile') {
      const f = el.files && el.files[0];
      if (f) handleImpFile(f);
      el.value = '';
      return;
    }
    if (el.dataset.secToggle !== undefined) {
      const p = state.pendingTemplate;
      const s = p && p.sections[Number(el.dataset.secToggle)];
      if (s) s.enabled = el.checked;
      return;
    }
    if (el.dataset.pendingLang) {
      if (state.pendingTemplate) state.pendingTemplate.lang = el.value;
      return;
    }
    if (el.dataset.pendingApplies) {
      if (state.pendingTemplate) state.pendingTemplate.appliesTo = el.value;
      return;
    }
    if (el.id === 'fileCamera' || el.id === 'fileAlbum') {
      const f = el.files && el.files[0];
      if (f) processImageFile(f);
      el.value = '';
      return;
    }
    if (el.id === 'importFile') {
      const f = el.files && el.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => importTemplates(reader.result);
      reader.readAsText(f);
      el.value = '';
    }
  });

  // 拖拽
  document.addEventListener('dragover', (e) => {
    const dz = e.target.closest && e.target.closest('#dropzone');
    if (!dz) return;
    e.preventDefault();
    dz.classList.add('drag');
  });
  document.addEventListener('dragleave', (e) => {
    const dz = e.target.closest && e.target.closest('#dropzone');
    if (dz) dz.classList.remove('drag');
  });
  document.addEventListener('drop', (e) => {
    const dz = e.target.closest && e.target.closest('#dropzone');
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove('drag');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) processImageFile(f);
  });

  // 粘贴图片
  document.addEventListener('paste', (e) => {
    if (state.view !== 'workspace' || state.step !== 2) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) {
        const f = items[i].getAsFile();
        if (f) processImageFile(f, 'pasted.png');
        return;
      }
    }
  });

  // Esc 关闭
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(); }
  });

  // 顶部品牌
  const brand = $('#brandHome');
  if (brand) brand.addEventListener('click', () => goView('home'));
  const top = $('#footTop');
  if (top) top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

// 修正：apply-fix 需要携带 JSON
const originalApplyFixRenderer = null;

function init() {
  if (/[?&]noanim\b/.test(location.search)) document.documentElement.classList.add('no-anim');
  loadStore();
  applyUrlParams();
  if (state.lang === 'en' && state.activeTemplateId === 'tpl-cn-standard') state.activeTemplateId = 'tpl-unh-en';
  if (state.experimentId && !currentExperiment()) state.experimentId = null;
  if (state.experimentId) {
    const exp = currentExperiment();
    if (exp && !Object.keys(state.values || {}).length) seedValues(exp);
  }
  bindEvents();
  render();
  if (window.location.hash === '#selftest') selfTest();
}

function applyUrlParams() {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get('lang') === 'en' || p.get('lang') === 'zh') state.lang = p.get('lang');
    const expParam = p.get('exp');
    if (expParam) {
      const exp = allExperiments().find((e) => e.id === expParam);
      if (exp) {
        state.experimentId = exp.id;
        seedValues(exp);
      }
    }
    const stepParam = Number(p.get('step'));
    if (stepParam >= 1 && stepParam <= 5) state.step = stepParam;
    const viewParam = p.get('view');
    if (['home', 'workspace', 'library', 'templates', 'help'].indexOf(viewParam) >= 0) state.view = viewParam;
  } catch (e) { /* 参数解析失败时使用本地状态 */ }
}

init();

// PWA：仅在 HTTPS 或本地 HTTP 环境注册 Service Worker（file:// 双击打开时自动跳过）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* 注册失败不影响使用 */ });
  });
}
// ==========================================================
</script>
