<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16305c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="实验小助手">
<title>实验小助手 · Lab Copilot</title>
<meta name="description" content="物理实验报告智能生成系统：拍照识别手绘表格，自动计算、逻辑校验，一键生成中英文规范实验报告。">
<style>
:root{
  --ink:#101828; --ink-2:#344054; --ink-3:#667085; --muted:#98a2b3;
  --paper:#fbf9f4; --paper-2:#f4f1e9; --card:#ffffff;
  --line:#e6e1d5; --line-2:#efece3;
  --primary:#16305c; --primary-2:#1d4ed8; --primary-soft:#eef2ff; --primary-ink:#1e3a8a;
  --amber:#b45309; --amber-soft:#fef3e2;
  --teal:#0f766e; --teal-soft:#e6f4f1;
  --danger:#b42318; --danger-soft:#fef3f2;
  --ok:#067647; --ok-soft:#ecfdf3;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  --shadow-md:0 10px 24px -12px rgba(16,24,40,.18), 0 2px 6px rgba(16,24,40,.05);
  --shadow-lg:0 24px 60px -24px rgba(16,24,40,.28);
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  background:var(--paper);
  background-image:
    linear-gradient(rgba(22,48,92,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(22,48,92,.032) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-font-smoothing:antialiased;
}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em;line-height:1.28}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-ink);text-decoration:none}
::selection{background:rgba(29,78,216,.16)}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px}
svg{display:block}
.hidden{display:none !important}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:60;height:var(--nav-h);
  display:flex;align-items:center;gap:18px;padding:0 26px;
  background:rgba(251,249,244,.86);backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:0;flex:none}
.brand-mark{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,#1b3b73,#101828);color:#f8f4e8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 4px 10px -4px rgba(16,24,40,.5);
}
.brand-name{display:flex;flex-direction:column;line-height:1.15;align-items:flex-start}
.brand-name b{font-size:16.5px;letter-spacing:.01em}
.brand-name span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topnav{display:flex;align-items:center;gap:2px;margin-left:8px}
.nav-link{
  padding:7px 13px;border-radius:9px;font-size:14px;font-weight:550;color:var(--ink-2);
  transition:background .16s,color .16s;
}
.nav-link:hover{background:rgba(22,48,92,.06);color:var(--ink)}
.nav-link.active{background:var(--primary);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.lang-switch{
  display:flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:999px;
  background:#fff;box-shadow:var(--shadow-sm);
}
.lang-switch button{
  padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--ink-3);
  transition:.16s;white-space:nowrap;
}
.lang-switch button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;
  border:1px solid transparent;transition:.16s ease;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(22,48,92,.65)}
.btn-primary:hover{background:#0f2547}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{border-color:#cfc9ba;background:#fffdf8;color:var(--ink)}
.btn-soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn-soft:hover{background:#e2e8ff}
.btn-amber{background:var(--amber);color:#fff}
.btn-amber:hover{background:#92400e}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:#f6d5d1}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:13px 26px;font-size:15.5px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ============ 布局 ============ */
.shell{max-width:1240px;margin:0 auto;padding:0 26px}
.view{animation:viewIn .32s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html.no-anim .view,html.no-anim .art-paper,html.no-anim .art-chip,html.no-anim .art-float{animation:none !important}
@media (prefers-reduced-motion:reduce){
  .view{animation:none}
  .scan-line{animation:none}
  *{scroll-behavior:auto !important}
}

/* ============ 首页 ============ */
.hero{padding:64px 0 10px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center}
.hero-grid>*{min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  font-size:12px;font-weight:600;color:var(--ink-2);
}
.eyebrow i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.hero h1{
  font-size:clamp(38px,5.4vw,62px);line-height:1.06;letter-spacing:-.035em;margin:22px 0 20px;
  font-weight:700;overflow-wrap:anywhere;
}
.hero h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--primary-2)}
.hero h1 .underline{position:relative;white-space:nowrap}
.hero h1 .underline::after{
  content:"";position:absolute;left:0;right:0;bottom:.06em;height:.28em;background:#f3d9ad;z-index:-1;border-radius:2px;
}
.hero-desc{font-size:16.5px;color:var(--ink-2);max-width:540px;line-height:1.78}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero-stats{display:flex;gap:34px;margin-top:38px;padding-top:24px;border-top:1px solid var(--line)}
.hero-stats div b{display:block;font-family:var(--serif);font-size:27px;line-height:1.1;letter-spacing:-.02em}
.hero-stats div span{font-size:12px;color:var(--ink-3);letter-spacing:.04em}

.hero-art{position:relative;min-height:486px}
.art-card{
  position:absolute;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-md);
}
.art-paper{inset:0 28px 96px 0;padding:22px;transform:rotate(-1.4deg);overflow:hidden}
.art-paper::before{
  content:"";position:absolute;left:22px;right:22px;top:0;height:3px;background:repeating-linear-gradient(90deg,#b45309 0 14px,transparent 14px 22px);
  opacity:.55;
}
.art-kicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:10px}
.art-title{font-family:var(--serif);font-size:21px;line-height:1.3;margin-bottom:16px}
.art-table{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono);table-layout:fixed}
.art-table th,.art-table td{border:1px solid #e3ded0;padding:6px 8px;text-align:left}
.art-table th{background:#f5f1e6;font-weight:600;font-size:10.5px;color:var(--ink-2)}
.art-table .ok{color:var(--teal);font-weight:600}
.art-bars{margin-top:14px;display:grid;gap:7px}
.art-bars i{height:6px;border-radius:3px;background:#ece7da;display:block;overflow:hidden}
.art-bars i::after{content:"";display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#16305c,#1d4ed8)}
.art-bars i:nth-child(1)::after{width:88%}
.art-bars i:nth-child(2)::after{width:64%;background:linear-gradient(90deg,#0f766e,#14b8a6)}
.art-bars i:nth-child(3)::after{width:41%;background:linear-gradient(90deg,#b45309,#f59e0b)}
.art-chip{
  position:absolute;right:-6px;top:-16px;padding:11px 15px;border-radius:14px;background:#fff;
  border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
  transform:rotate(1.5deg);z-index:3;
}
.art-chip .dot{width:9px;height:9px;border-radius:50%;background:#12b76a;box-shadow:0 0 0 4px rgba(18,183,106,.16)}
.art-chip b{font-size:12.5px}
.art-chip span{display:block;font-size:10.5px;color:var(--ink-3)}
.art-float{
  position:absolute;left:0;bottom:0;right:64px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(150deg,#152a4f,#101828);color:#fff;box-shadow:var(--shadow-lg);
  transform:rotate(1deg);
}
.art-float-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#b9c6dd}
.art-float-row+.art-float-row{margin-top:9px}
.art-float b{font-family:var(--mono);font-size:13px;color:#fff;letter-spacing:.02em}
.art-float .badge{background:rgba(255,255,255,.12);border-radius:5px;padding:2px 7px;font-size:10px;letter-spacing:.08em}

.section{padding:64px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.section-head h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.025em}
.section-head p{color:var(--ink-3);font-size:14px;margin-top:7px;max-width:560px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feature{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 24px;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s;position:relative;overflow:hidden;
}
.feature:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#d6d0c2}
.feature-num{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);letter-spacing:.06em}
.feature-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin:16px 0 18px}
.feature h3{font-size:17px;margin-bottom:8px}
.feature p{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.feature-tag{position:absolute;right:20px;top:22px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flow-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.flow-item{padding:22px 18px;position:relative;border-right:1px solid var(--line-2)}
.flow-item:last-child{border-right:none}
.flow-item b{display:block;font-family:var(--serif);font-size:12px;color:var(--amber);letter-spacing:.08em;margin-bottom:8px}
.flow-item h4{font-size:14px;margin-bottom:6px}
.flow-item p{font-size:12px;color:var(--ink-3);line-height:1.6}
.flow-item::after{content:"";position:absolute;right:-5px;top:50%;width:9px;height:9px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff;transform:translateY(-50%) rotate(45deg);z-index:2}
.flow-item:last-child::after{display:none}
.template-strip{display:flex;flex-wrap:wrap;gap:9px}
.tpl-pill{
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;
  border:1px solid var(--line);font-size:13px;color:var(--ink-2);box-shadow:var(--shadow-sm);
}
.tpl-pill i{width:6px;height:6px;border-radius:50%;background:var(--primary-2)}
.tpl-pill.telecom i{background:var(--teal)}

/* ============ 工作台 ============ */
.workspace{padding:26px 0 80px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:34px;align-items:start}
.workspace>*{min-width:0}
.stepper{position:sticky;top:calc(var(--nav-h) + 24px)}
.stepper-label{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:16px;padding-left:4px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:15px;top:18px;bottom:18px;width:1px;background:var(--line)}
.step{position:relative;display:flex;gap:13px;padding:9px 0;cursor:default}
.step-dot{
  width:31px;height:31px;flex:none;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-3);
  font-family:var(--serif);font-size:12.5px;z-index:1;transition:.2s;font-weight:600;
}
.step-body{padding-top:3px;min-width:0}
.step-body b{display:block;font-size:13.5px;font-weight:600;color:var(--ink-3);transition:color .2s}
.step-body span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.step.active .step-dot{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(22,48,92,.1)}
.step.active .step-body b{color:var(--ink)}
.step.done .step-dot{background:var(--ok-soft);color:var(--ok);border-color:#b7e4c7}
.step.done .step-body b{color:var(--ink-2)}
.step.locked{opacity:.62}
.step.clickable{cursor:pointer}
.step.clickable:hover .step-body b{color:var(--primary-ink)}
.stepper-link{display:flex;align-items:center;gap:7px;margin-top:14px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-3);box-shadow:var(--shadow-sm);transition:.15s}
.stepper-link:hover{border-color:#cfc9ba;color:var(--ink);background:#fffdf8}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.panel-head{padding:22px 26px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.panel-head h2{font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.panel-head .kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:4px}
.panel-head p{font-size:13px;color:var(--ink-3);margin-top:5px;max-width:640px}
.panel-head .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:26px}
.panel-foot{padding:18px 26px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fffdf9}
.panel-foot .spacer{margin-left:auto}
.foot-note{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:7px}

/* 实验选择 */
.searchbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.searchbar input{
  flex:1;min-width:200px;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--line);
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23667085' stroke-width='1.8'><circle cx='7' cy='7' r='5'/><path d='M11 11l4 4'/></svg>") no-repeat 13px 50%;
  font-size:14px;transition:.16s;
}
.searchbar input:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-3);transition:.15s}
.chip-btn:hover{border-color:#cfc9ba;color:var(--ink-2)}
.chip-btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:13px}
.exp-card{
  text-align:left;padding:18px 18px 16px;border:1px solid var(--line);border-radius:13px;background:#fff;
  transition:.18s;display:flex;flex-direction:column;gap:9px;position:relative;
}
.exp-card:hover{border-color:#c9c2b2;transform:translateY(-2px);box-shadow:var(--shadow-md)}
.exp-card[aria-pressed="true"]{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(29,78,216,.1),var(--shadow-md);background:#fff}
.exp-card .cat{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.pill.physics{background:var(--primary-soft);color:var(--primary-ink)}
.pill.telecom{background:var(--teal-soft);color:var(--teal)}
.pill.custom{background:var(--amber-soft);color:var(--amber)}
.exp-card .ver{font-size:10px;color:var(--muted);font-family:var(--mono)}
.exp-card h3{font-size:15.5px;line-height:1.4;letter-spacing:-.01em}
.exp-card .en{font-size:11.5px;color:var(--ink-3);font-family:var(--serif);font-style:italic;line-height:1.4}
.exp-card .meta{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line-2)}
.exp-card .check{position:absolute;top:14px;right:14px;width:20px;height:20px;border-radius:50%;background:var(--primary-2);color:#fff;display:none;place-items:center}
.exp-card[aria-pressed="true"] .check{display:grid}

/* 选中实验摘要 */
.exp-summary{margin-top:18px;border:1px solid var(--line);border-radius:13px;background:#fffdf9;padding:18px 20px}
.exp-summary-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.exp-summary-head h3{font-size:16px}
.exp-summary-body{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}
.exp-summary-body p{font-size:13px;color:var(--ink-2);line-height:1.75}
.exp-meta-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.exp-meta-list li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding-bottom:8px;border-bottom:1px dashed var(--line-2)}
.exp-meta-list li:last-child{border-bottom:none;padding-bottom:0}
.exp-meta-list span{color:var(--ink-3)}
.exp-meta-list b{font-weight:600;text-align:right}
.formula-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.formula-strip code{font-family:var(--mono);font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--primary-ink)}

/* 上传区 */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dropzone{
  border:1.5px dashed #cfc9ba;border-radius:16px;background:#fffdf8;padding:34px 24px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;transition:.2s;
  min-height:248px;justify-content:center;position:relative;
}
.dropzone.drag{border-color:var(--primary-2);background:var(--primary-soft);transform:scale(.995)}
.dropzone .dz-ico{width:54px;height:54px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:6px;box-shadow:var(--shadow-sm)}
.dropzone h4{font-size:15px}
.dropzone p{font-size:12.5px;color:var(--ink-3);max-width:280px}
.dropzone .dz-actions{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.dropzone .hint-line{font-size:11px;color:var(--muted);margin-top:6px}
.preview-box{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f7f4ec;min-height:248px;display:flex;flex-direction:column}
.preview-head{padding:9px 14px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--line);background:#fff}
.preview-head .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.preview-head .name{font-family:var(--mono);font-size:11px;margin-left:auto;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-head .size-info{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.preview-img-wrap{flex:1;display:grid;place-items:center;padding:12px;overflow:hidden}
.preview-img-wrap img{max-width:100%;max-height:300px;border-radius:8px;box-shadow:0 4px 16px rgba(16,24,40,.14)}
.preview-empty{color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.scan-overlay{position:relative;overflow:hidden}
.scan-line{position:absolute;left:0;right:0;height:38%;background:linear-gradient(180deg,rgba(29,78,216,0) 0%,rgba(29,78,216,.18) 50%,rgba(29,78,216,0) 100%);animation:scan 1.5s linear infinite;pointer-events:none}
@keyframes scan{0%{top:-38%}100%{top:100%}}
.ocr-progress{height:5px;border-radius:3px;background:#eee9dc;overflow:hidden;margin-top:12px}
.ocr-progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#16305c,#1d4ed8);transition:width .3s ease}
.ocr-status{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:7px}

/* 识别结果表 */
.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.data th{
  background:#f7f4ec;text-align:left;padding:10px 13px;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.data td{padding:9px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{transition:background .14s}
table.data tbody tr:hover{background:#fffdf7}
table.data .sym{font-family:var(--mono);font-size:12px;color:var(--primary-ink);font-weight:600}
table.data input.cell-input{
  width:100%;min-width:88px;padding:6px 9px;border:1px solid transparent;border-radius:7px;
  background:#faf8f3;font-family:var(--mono);font-size:13px;transition:.14s;
}
table.data input.cell-input:hover{border-color:var(--line)}
table.data input.cell-input:focus{outline:none;border-color:var(--primary-2);background:#fff;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
table.data input.cell-input.low{border-color:#f0c36d;background:#fffaf0}
.unit-tag{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.conf{display:flex;align-items:center;gap:7px;min-width:96px}
table.data.compact{min-width:0}
table.data.compact th{padding:8px 10px;font-size:10px}
table.data.compact td{padding:7px 10px}
table.data.compact .cell-input{min-width:70px}
.const-mark{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:3px;letter-spacing:.04em;white-space:nowrap}
.unit-inline{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-left:4px}
.fx-btn{padding:3px 8px !important;font-size:11px !important;font-family:var(--serif);font-style:italic;color:var(--primary-ink) !important}
.feature-ico svg{width:22px;height:22px}
.dz-ico svg{width:26px;height:26px}
.empty-state .es-ico svg{width:22px;height:22px}
.conf-bar{flex:1;height:5px;border-radius:3px;background:#eee9dc;overflow:hidden}
.conf-bar i{display:block;height:100%;border-radius:3px}
.conf b{font-size:11.5px;font-family:var(--mono);font-weight:600;width:38px;text-align:right}
.conf.high i{background:#12b76a}.conf.mid i{background:#f59e0b}.conf.low i{background:#ef4444}
.badge-sm{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.04em}
.badge-sm.low{background:var(--amber-soft);color:var(--amber)}
.badge-sm.ok{background:var(--ok-soft);color:var(--ok)}
.badge-sm.info{background:var(--primary-soft);color:var(--primary-ink)}
.badge-sm.err{background:var(--danger-soft);color:var(--danger)}

/* 计算区 */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.calc-grid>*{min-width:0}
.calc-block h4{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:11px;color:var(--ink-2)}
.calc-block h4 .count{font-size:10.5px;background:var(--paper-2);border-radius:999px;padding:1px 8px;color:var(--ink-3);font-weight:700}
.result-value{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.result-row-new td{background:#fbfdff}
.formula-pop{
  margin-top:12px;border:1px solid #dbe3f5;background:#f7f9ff;border-radius:11px;padding:14px 16px;
}
.formula-pop .fp-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--primary-ink);margin-bottom:8px}
.formula-pop .fp-expr{
  font-family:var(--mono);font-size:12.5px;line-height:1.9;color:var(--ink-2);background:#fff;
  border:1px solid #e4e9f7;border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;
}
.formula-pop .fp-note{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.calc-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.sig-note{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sig-note code{font-family:var(--mono);background:var(--paper-2);padding:1px 5px;border-radius:4px;font-size:11px}

/* 校验 */
.issue-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.issue-stat{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff}
.issue-stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1}
.issue-stat span{font-size:11.5px;color:var(--ink-3)}
.issue-stat.error{background:var(--danger-soft);border-color:#f6d5d1}
.issue-stat.error b{color:var(--danger)}
.issue-stat.warn{background:var(--amber-soft);border-color:#f3dfbe}
.issue-stat.warn b{color:var(--amber)}
.issue-stat.ok{background:var(--ok-soft);border-color:#b7e4c7}
.issue-stat.ok b{color:var(--ok)}
.issue-list{display:flex;flex-direction:column;gap:9px}
.issue{
  display:flex;gap:13px;padding:14px 16px;border-radius:11px;border:1px solid var(--line);background:#fff;
}
.issue.error{border-color:#f6d5d1;background:#fffbfa}
.issue.warn{border-color:#f3dfbe;background:#fffcf5}
.issue.ok{border-color:#d3f0dd;background:#fbfefc}
.issue-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700}
.issue.error .issue-ico{background:var(--danger-soft);color:var(--danger)}
.issue.warn .issue-ico{background:var(--amber-soft);color:var(--amber)}
.issue.ok .issue-ico{background:var(--ok-soft);color:var(--ok)}
.issue-main{min-width:0;flex:1}
.issue-main b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.issue-main p{font-size:12.5px;color:var(--ink-2);line-height:1.65}
.issue-main .suggest{margin-top:7px;font-size:12px;color:var(--primary-ink);background:var(--primary-soft);padding:6px 10px;border-radius:7px;display:inline-block}
.issue-action{flex:none;align-self:center}
.issue-meta{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:5px}
.empty-state{padding:38px 20px;text-align:center;color:var(--ink-3)}
.empty-state .es-ico{width:50px;height:50px;border-radius:14px;background:var(--paper-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--ink-3)}
.empty-state h4{font-size:14.5px;color:var(--ink-2);margin-bottom:5px}
.empty-state p{font-size:12.5px;max-width:360px;margin:0 auto}

/* 报告 */
.report-layout{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:24px;align-items:start}
.report-layout>*{min-width:0}
.report-side{position:sticky;top:calc(var(--nav-h) + 20px);display:grid;gap:12px}
.side-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px}
.side-card h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.side-actions{display:grid;gap:8px}
.side-actions .btn{width:100%;justify-content:flex-start}
.report-paper{
  background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-md);
  padding:52px 58px;font-family:var(--serif);font-size:13.5px;line-height:1.85;color:#1d2939;
  max-width:820px;margin:0 auto;
}
.rp-cover{text-align:center;padding-bottom:24px;border-bottom:2px solid #1d2939;margin-bottom:26px}
.rp-school{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans);font-weight:700}
.rp-cover h1{font-size:23px;line-height:1.4;margin:14px 0 6px;letter-spacing:.01em}
.rp-cover .sub{font-size:13px;font-style:italic;color:var(--ink-2)}
.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 26px;margin-top:20px;font-size:11.5px;text-align:left;font-family:var(--sans)}
.rp-meta div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted #cfc9ba;padding-bottom:4px}
.rp-meta span{color:var(--ink-3)}
.rp-section{margin-bottom:22px;page-break-inside:avoid}
.rp-section h2{
  font-family:var(--sans);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:#16305c;padding-bottom:5px;border-bottom:1px solid #d8d2c4;margin-bottom:11px;
  display:flex;align-items:baseline;gap:9px;
}
.rp-section h2 .num{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--amber);letter-spacing:0}
.rp-section p{margin-bottom:8px;text-align:justify}
.rp-section ul,.rp-section ol{margin:0 0 8px;padding-left:22px}
.rp-section li{margin-bottom:4px}
.rp-formula{
  font-family:var(--mono);font-size:12px;background:#faf8f2;border-left:3px solid #16305c;
  padding:9px 13px;margin:9px 0;border-radius:0 6px 6px 0;overflow-x:auto;line-height:1.8;
}
.rp-steps{padding-left:20px;margin:6px 0 10px;font-family:var(--sans);font-size:11pt;line-height:1.7}
.rp-steps li{margin-bottom:6px}
.report-audit{border:1px solid var(--line);border-radius:10px;background:#fffdf8;padding:10px 14px;margin:0 0 14px;font-size:12px;color:var(--ink-2)}
.report-audit summary{cursor:pointer;font-weight:600;font-size:12px}
.report-audit table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
.report-audit th,.report-audit td{border-bottom:1px solid var(--line-2);padding:4px 6px;text-align:left}
.report-audit th{font-size:10px;letter-spacing:.04em;color:var(--ink-3)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:16px}
.tpl-card{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.tpl-card.active{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.tpl-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.tpl-thumb{height:118px;background:#f7f4ec;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-2)}
.tpl-thumb i{display:block;height:5px;border-radius:3px;background:#ddd6c4}
.tpl-thumb i.head{height:9px;width:52%;background:#16305c;margin-bottom:4px}
.tpl-thumb i.short{width:58%}
.tpl-card-body{padding:14px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.tpl-card-body h3{font-size:14.5px;line-height:1.4}
.tpl-meta-line{font-size:11px;color:var(--ink-3);display:flex;gap:9px;flex-wrap:wrap}
.tpl-card-foot{padding:10px 14px;border-top:1px solid var(--line-2);display:flex;gap:6px;flex-wrap:wrap;background:#fffdf9}
.tpl-badge{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.tpl-badge.active{background:var(--primary-soft);color:var(--primary-ink)}
.tpl-section-row{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:#fff;margin-bottom:6px}
.tpl-section-row input[type=text]{flex:1;min-width:150px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px}
.tpl-section-row .muted{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.pending-box{border:1px solid var(--line);border-radius:12px;background:#fffdf8;padding:16px;margin-top:14px}
.rp-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:10.5px;margin:10px 0;page-break-inside:avoid}
.rp-table th,.rp-table td{border:1px solid #cfc9ba;padding:5px 7px;text-align:left;vertical-align:top}
.rp-table th{background:#f4f1e8;font-weight:700;font-size:10px;letter-spacing:.03em}
.rp-table td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.rp-table caption{caption-side:top;text-align:left;font-size:10.5px;color:var(--ink-3);padding-bottom:5px;font-family:var(--sans)}
.rp-note{font-size:11px;color:var(--ink-3);font-style:italic;margin-top:5px;font-family:var(--sans)}
.rp-sign{display:flex;justify-content:space-between;gap:26px;margin-top:34px;padding-top:14px;border-top:1px solid #d8d2c4;font-size:11px;font-family:var(--sans);color:var(--ink-2)}
.rp-sign .line{flex:1;border-bottom:1px solid #bfb8a8;height:18px}
.rp-sign .line-wrap{flex:1;display:flex;gap:8px;align-items:flex-end}
.rp-checklist{list-style:none;padding:0;margin:0;font-family:var(--sans);font-size:11.5px}
.rp-checklist li{display:flex;gap:9px;align-items:flex-start;margin-bottom:5px}
.rp-checklist .box{width:12px;height:12px;border:1px solid #8a8272;border-radius:3px;flex:none;margin-top:3px}
.rp-badge{display:inline-block;padding:1px 6px;border:1px solid #cfc9ba;border-radius:4px;font-size:9.5px;font-family:var(--sans);font-weight:700;color:var(--ink-2);margin-left:6px;vertical-align:middle}

/* 模板库 */
.lib-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.lib-stat{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff}
.lib-stat b{font-family:var(--serif);font-size:24px;display:block;line-height:1.15}
.lib-stat span{font-size:11.5px;color:var(--ink-3)}
.lib-table td:last-child{text-align:right;white-space:nowrap}
.lib-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3);transition:.15s}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);border-color:#f6d5d1;color:var(--danger)}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{
  padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
  font-size:13.5px;transition:.15s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.field textarea{font-family:var(--mono);font-size:12px;line-height:1.7;min-height:150px;resize:vertical}
.field .flush{font-size:11px;color:var(--muted)}
.json-editor{background:#121a2a;color:#dfe8f6;border-radius:11px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.75;border:1px solid #263349;width:100%;min-height:320px;resize:vertical;tab-size:2}
.json-editor:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:9px 15px;font-size:13px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--primary-ink);border-bottom-color:var(--primary-2)}

/* 帮助 / 架构 */
.arch-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.arch-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:22px}
.arch-card h3{font-size:15px;margin-bottom:9px;display:flex;align-items:center;gap:9px}
.arch-card p,.arch-card li{font-size:12.8px;color:var(--ink-2);line-height:1.72}
.arch-card ul{padding-left:18px;margin:6px 0 0}
.arch-card code{font-family:var(--mono);background:var(--paper-2);padding:1px 5px;border-radius:4px;font-size:11.5px}
.arch-flow{display:grid;gap:8px;margin-top:12px}
.arch-flow>div{display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
.arch-flow>div>div{flex:1;min-width:0}
.arch-flow .af-n{width:20px;height:20px;border-radius:6px;background:var(--paper-2);color:var(--ink-3);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.callout{border-left:3px solid var(--amber);background:var(--amber-soft);padding:12px 15px;border-radius:0 8px 8px 0;font-size:12.5px;color:#713f12;line-height:1.7;margin-top:14px}
.callout b{font-weight:700}

/* Modal / Toast */
.modal-mask{
  position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;width:min(720px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 40px 90px -30px rgba(16,24,40,.5);animation:modalIn .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{font-size:16.5px}
.modal-head .close{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.modal-head .close:hover{background:var(--paper-2);color:var(--ink)}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;background:#fffdf9;position:sticky;bottom:0}
#toastRoot{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#101828;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastIn .22s ease;
  max-width:min(90vw,520px);
}
.toast.ok{background:#054f31}.toast.warn{background:#7a2e0e}.toast.err{background:#7a271a}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 页脚 */
.footer{border-top:1px solid var(--line);padding:30px 0;margin-top:20px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.footer p{font-size:11.5px;color:var(--muted)}
.footer .f-links{display:flex;gap:16px;font-size:11.5px}
.footer .f-links button{color:var(--ink-3)}
.footer .f-links button:hover{color:var(--ink)}

/* 响应式 */
@media (max-width:1080px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:40px}
  .hero-art{min-height:340px;max-width:520px}
  .workspace{grid-template-columns:minmax(0,1fr);gap:20px}
  .stepper{position:static}
  .stepper-label{margin-bottom:10px}

  .report-side{position:static;order:-1}
  .side-actions{grid-template-columns:repeat(2,1fr)}
  .calc-grid{grid-template-columns:minmax(0,1fr)}
  .upload-grid{grid-template-columns:1fr}
  .arch-grid{grid-template-columns:1fr}
  .lib-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .shell{padding:0 16px}
  .topbar{padding:0 14px;gap:10px}
  .brand-name span{display:none}
  .brand-name b{font-size:15px}
  #btnQuickStart{display:none}
  .lang-switch button{padding:5px 9px;font-size:11.5px}
  .topnav{display:none}

  .hero-desc{font-size:15px}
  .hero-art{min-height:300px;max-width:100%}
  .art-paper{inset:0 14px 92px 0;padding:16px}
  .art-table{font-size:10px}
  .art-table th,.art-table td{padding:5px 6px}

  .issue-summary{grid-template-columns:1fr}
  .side-actions{grid-template-columns:1fr}
  .section{padding:40px 0}
  .rp-sign{flex-direction:column;gap:18px}
}
@media print{
  body{background:#fff;background-image:none}
  .topbar,.footer,.report-side,.panel-head,.panel-foot,.stepper,#toastRoot,.no-print{display:none !important}
  .shell{padding:0;max-width:none}
  .workspace{display:block;padding:0}
  .panel{border:none;box-shadow:none;border-radius:0;background:#fff !important}

}

const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const roundTo = (n, d) => {
  if (!isFinite(n)) return n;
  const f = Math.pow(10, d);
  return Math.round((n + Number.EPSILON) * f) / f;
};
const fmtNum = (n, sig, fallback) => {
  if (n == null || !isFinite(n)) return fallback == null ? '—' : fallback;
  const abs = Math.abs(n);
  if (abs === 0) return '0';
  const digits = clamp(sig || 4, 1, 12);
  const exp = Math.floor(Math.log10(abs));
  const decimals = clamp(digits - 1 - exp, 0, 12);
  if (abs >= 1e6 || abs < 1e-4) return n.toExponential(clamp(digits - 1, 1, 10)).replace('e+', '×10^').replace('e-', '×10^-');
  return n.toFixed(decimals);
};

};

    },
    principle: {
      zh: '惠斯通电桥由四个桥臂 R₁、R₂、R₃、Rₓ 组成，对角接入电源与检流计。调节比较臂使检流计指示为零（Ig = 0），B、D 两点等电势，电桥平衡。由并联支路电压相等可得 R₁I₁ = R₃I₃、R₂I₂ = RₓIₓ；平衡时 I₁ = I₂、I₃ = Iₓ，故 Rₓ = (R₂/R₃)·R₁ = kR₁，k 称为比率系数。电桥灵敏度 S = Δn/(ΔRₓ/Rₓ)，检流计偏转格数越多、灵敏度越高，测量误差越小。',
      en: 'A Wheatstone bridge has four arms R₁, R₂, R₃ and Rₓ, with the source and galvanometer connected across opposite nodes. Adjusting the standard arm until the galvanometer reads zero (Ig = 0) makes nodes B and D equipotential. Equal voltages across the parallel branches give R₁I₁ = R₃I₃ and R₂I₂ = RₓIₓ; at balance I₁ = I₂ and I₃ = Iₓ, hence Rₓ = (R₂/R₃)·R₁ = kR₁, where k is the ratio coefficient. Sensitivity S = Δn/(ΔRₓ/Rₓ); a larger deflection per relative resistance change means a smaller measurement error.'

    principle: {

    inputs: [

      { type: 'range', key: 'n', min: 1.3, max: 1.9, level: 'error', msg: { zh: '折射率 n = {value} 超出常见光学玻璃范围（1.3–1.9）。', en: 'Refractive index {value} is outside common glass values (1.3–1.9).' }, hint: { zh: '检查顶角与最小偏向角是否对应同一棱镜、同一波长。', en: 'Check that A and δ_min refer to the same prism and wavelength.' } },

      en: 'A three-line pendulum has two horizontal discs joined by three equal wires; the lower disc oscillates about the vertical axis. For lower-disc mass m₀, suspension radius R, upper-disc radius r, and separation H, the small-angle period T₀ gives I₀ = m₀gRrT₀²/(4π²H). Adding a ring of mass m₁ changes the period to T₁, and additivity gives I₁ = (m₀+m₁)gRrT₁²/(4π²H) − I₀. The theoretical ring value is I_th = m₁(D² + d²)/8, with D and d the outer and inner diameters.'

// ----------------------------------------------------------
// 4. 表达式引擎（递归下降，禁用 eval，保证可移植到小程序）
// ----------------------------------------------------------
const FUNCS = {
  sqrt: Math.sqrt, abs: Math.abs, sin: Math.sin, cos: Math.cos, tan: Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan, exp: Math.exp,
  ln: Math.log, log: (x) => Math.log(x) / Math.LN10, lg: (x) => Math.log(x) / Math.LN10,
  pow: Math.pow, round: Math.round, floor: Math.floor, ceil: Math.ceil,
  min: Math.min, max: Math.max
};
const CONSTS = { PI: Math.PI, E: Math.E };
const EXPR_CACHE = new Map();

function tokenize(src) {
  const tk = [];
  let i = 0;
  const s = String(src);
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i + 1] || ''))) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      if (s[j] === 'e' || s[j] === 'E') {
        let k = j + 1;
        if (s[k] === '+' || s[k] === '-') k++;
        if (/[0-9]/.test(s[k] || '')) {
          k++;
          while (k < s.length && /[0-9]/.test(s[k])) k++;
          j = k;
        }
      }
      tk.push({ t: 'num', v: parseFloat(s.slice(i, j)) });
      i = j;
      continue;
    }
    if (/[a-zA-Z_]/.test(c)) {
      let j = i;
      while (j < s.length && /[a-zA-Z0-9_]/.test(s[j])) j++;
      tk.push({ t: 'id', v: s.slice(i, j) });
      i = j;
      continue;
    }
    if ('+-*/^%(),'.includes(c)) { tk.push({ t: c }); i++; continue; }
    throw new Error('Unsupported character: ' + c);
  }
  return tk;
}

function compile(expr) {
  const key = String(expr);
  if (EXPR_CACHE.has(key)) return EXPR_CACHE.get(key);
  const tokens = tokenize(key);
  let pos = 0;
  const peek = () => tokens[pos];
  const eat = (t) => {
    if (!tokens[pos] || tokens[pos].t !== t) throw new Error('Expected ' + t + ' at position ' + pos);
    return tokens[pos++];
  };

  function parseAdd() {
    let node = parseMul();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = tokens[pos++].t;
      node = { t: 'bin', op, a: node, b: parseMul() };
    }
    return node;
  }
  function parseMul() {
    let node = parseUnary();
    while (peek() && (peek().t === '*' || peek().t === '/' || peek().t === '%')) {
      const op = tokens[pos++].t;
      node = { t: 'bin', op, a: node, b: parseUnary() };
    }
    return node;
  }
  function parseUnary() {
    if (peek() && (peek().t === '-' || peek().t === '+')) {
      const op = tokens[pos++].t;
      return { t: 'un', op, a: parseUnary() };
    }
    return parsePower();
  }
  function parsePower() {
    const base = parsePrimary();
    if (peek() && peek().t === '^') {
      pos++;
      return { t: 'bin', op: '^', a: base, b: parseUnary() };
    }
    return base;
  }
  function parsePrimary() {
    const cur = peek();
    if (!cur) throw new Error('Unexpected end of expression');
    if (cur.t === 'num') { pos++; return { t: 'num', v: cur.v }; }
    if (cur.t === 'id') {
      pos++;
      if (peek() && peek().t === '(') {
        pos++;
        const args = [];
        if (peek() && peek().t !== ')') {
          args.push(parseAdd());
          while (peek() && peek().t === ',') { pos++; args.push(parseAdd()); }
        }
        eat(')');
        return { t: 'call', name: cur.v, args };
      }
      return { t: 'var', name: cur.v };
    }
    if (cur.t === '(') { pos++; const n = parseAdd(); eat(')'); return n; }
    throw new Error('Unexpected token: ' + cur.t);
  }

  const ast = parseAdd();
  if (pos !== tokens.length) throw new Error('Trailing tokens in expression');
  EXPR_CACHE.set(key, ast);
  return ast;
}

function walkVars(ast, out) {
  if (!ast) return out;
  if (ast.t === 'var') out.add(ast.name);
  else if (ast.t === 'bin') { walkVars(ast.a, out); walkVars(ast.b, out); }
  else if (ast.t === 'un') walkVars(ast.a, out);
  else if (ast.t === 'call') ast.args.forEach((a) => walkVars(a, out));
  return out;
}
function collectVars(ast) { return Array.from(walkVars(ast, new Set())); }

function evalAst(ast, scope) {
  switch (ast.t) {
    case 'num': return ast.v;
    case 'var': {
      if (ast.name in CONSTS) return CONSTS[ast.name];
      if (scope[ast.name] === undefined || scope[ast.name] === null) throw new Error('missing:' + ast.name);
      const v = scope[ast.name];
      if (typeof v === 'number' && !isFinite(v)) throw new Error('missing:' + ast.name);
      return v;
    }
    case 'un': {
      const v = evalAst(ast.a, scope);
      return ast.op === '-' ? -v : v;
    }
    case 'bin': {
      const a = evalAst(ast.a, scope), b = evalAst(ast.b, scope);
      switch (ast.op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': if (b === 0) throw new Error('div0'); return a / b;
        case '%': return a % b;
        case '^': return Math.pow(a, b);
      }
      throw new Error('bad operator');
    }
    case 'call': {
      const fn = FUNCS[ast.name];
      if (!fn) throw new Error('unknown func:' + ast.name);
      const args = ast.args.map((a) => evalAst(a, scope));
      return fn.apply(null, args);
    }
    default: throw new Error('bad ast');
  }
}

function evalExpr(expr, scope) {
  return evalAst(compile(expr), scope);
}

function prettify(s) {
  return String(s)
    .replace(/\*/g, ' × ')
    .replace(/\//g, ' ÷ ')
    .replace(/\bPI\b/g, 'π')
    .replace(/\s+/g, ' ')
    .replace(/\(\s+/g, '(')
    .replace(/\s+\)/g, ')')
    .trim();
}

function substitute(expr, scope, sigMap, fallback) {
  const out = String(expr).replace(/[a-zA-Z_][a-zA-Z0-9_]*/g, (name) => {
    if (FUNCS[name]) return name;
    if (name === 'PI') return 'π';
    if (name === 'E') return 'e';
    if (scope[name] !== undefined && isFinite(scope[name])) {
      const s = (sigMap && sigMap[name]) || fallback || 4;
      return fmtNum(scope[name], s);
    }
    return name;
  });
  return prettify(out);
}

// ----------------------------------------------------------
// 5. 计算引擎
// ----------------------------------------------------------
function computeExperiment(exp, values) {
  const scope = {};
  (exp.inputs || []).forEach((inp) => {
    if (values[inp.key] !== undefined && values[inp.key] !== null && values[inp.key] !== '') {
      const n = Number(values[inp.key]);
      if (isFinite(n)) scope[inp.key] = n;
    }
  });

  const list = exp.derived || [];
  const map = {};
  list.forEach((d) => { map[d.key] = d; });
  const sigMap = {};
  (exp.inputs || []).forEach((i) => { sigMap[i.key] = i.sig || 4; });
  list.forEach((d) => { sigMap[d.key] = d.sig || 4; });

  const mark = {};
  const order = [];
  let circular = false;
  function visit(key) {
    if (mark[key] === 2) return;
    if (mark[key] === 1) { circular = true; return; }
    mark[key] = 1;
    const d = map[key];
    if (d) {
      try {
        collectVars(compile(d.expr)).forEach((v) => { if (map[v]) visit(v); });
      } catch (e) { /* 表达式语法错误在求值阶段报告 */ }
    }
    mark[key] = 2;
    order.push(key);
  }
  list.forEach((d) => visit(d.key));

  const solved = {};
  order.forEach((key) => {
    const d = map[key];
    if (!d) return;
    const row = {
      key: d.key, symbol: d.symbol || d.key,
      label: d.label || { zh: d.key, en: d.key },
      unit: d.unit || '', sig: d.sig || 4,
      exprText: d.expression || d.expr,
      highlight: !!d.highlight
    };
    try {
      const ast = compile(d.expr);
      const vars = collectVars(ast);
      const missing = vars.filter((v) => !(v in CONSTS) && (scope[v] === undefined || !isFinite(Number(scope[v]))));
      if (missing.length) throw new Error('missing:' + missing[0]);
      const val = evalAst(ast, scope);
      if (!isFinite(val)) throw new Error('nonfinite');
      scope[key] = val;
      row.value = val;
      row.display = fmtNum(val, d.sig || 4);
      row.substituted = substitute(d.expr, scope, sigMap, d.sig || 4);
      row.ok = true;
    } catch (err) {
      scope[key] = NaN;
      row.value = null;
      row.display = '—';
      row.ok = false;
      const msg = String(err && err.message || err);
      row.error = msg.indexOf('missing:') === 0 ? 'missing:' + msg.split(':')[1] : msg;
    }
    solved[key] = row;
  });

  const results = list.map((d) => solved[d.key]).filter(Boolean);
  return { scope, results, order, circular };
}

// ----------------------------------------------------------
// 6. 校验引擎
// ----------------------------------------------------------
function fill(tpl, vars) {
  return String(tpl == null ? '' : tpl).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m));
}
function localized(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[state.lang] || obj.zh || obj.en || '';
}
function compareValues(a, op, b) {
  switch (op) {
    case '<=': return a <= b;
    case '>=': return a >= b;
    case '<': return a < b;
    case '>': return a > b;
    case '==': return Math.abs(a - b) < 1e-9;
    case '!=': return Math.abs(a - b) >= 1e-9;
    default: return false;
  }
}

function runChecks(exp, scope) {
  const issues = [];
  const passed = [];
  const rules = exp.checks || [];

  rules.forEach((rule, idx) => {
    const base = {
      id: exp.id + '-rule-' + idx,
      type: rule.type,
      title: t('check.rule.' + rule.type),
      level: rule.level || 'warn'
    };
    let failed = false;
    let vars = {};
    let msg = '';
    let hint = '';
    let fix = null;

    try {
      if (rule.type === 'range') {
        const v = Number(scope[rule.key]);
        if (!isFinite(v)) return;
        vars.value = fmtNum(v, 4);
        if (v < rule.min || v > rule.max) {
          failed = true;
          if (rule.msg) msg = fill(localized(rule.msg), vars);
          else msg = t('check.rule.range') + ': ' + vars.value;
          hint = localized(rule.hint) || '';
          if (rule.autoScale !== false) fix = findScaleFix(exp, rule);
        }

      } else if (rule.type === 'compare') {
        const a = evalExpr(rule.left, scope);
        const b = evalExpr(rule.right, scope);
        vars.value = fmtNum(a, 4);
        if (!compareValues(a, rule.op, b)) {
          failed = true;
          msg = fill(localized(rule.msg), vars);
          hint = localized(rule.hint) || '';
          if (rule.fix && rule.fix.key) {
            let fv = null;
            try { fv = evalExpr(rule.fix.expr, scope); } catch (e) { fv = null; }
            if (fv != null && isFinite(fv)) fix = { key: rule.fix.key, value: fv, note: rule.fix.note || '' };
          }
        }
      } else if (rule.type === 'deviation') {
        const v = Number(scope[rule.key]);
        const ref = Number(scope[rule.ref]);
        if (!isFinite(v) || !isFinite(ref) || ref === 0) return;
        const dev = (v - ref) / Math.abs(ref) * 100;
        vars.value = Math.abs(dev).toFixed(2);
        if (Math.abs(dev) > rule.tol) {
          failed = true;
          msg = fill(localized(rule.msg), vars);
          hint = localized(rule.hint) || '';
        }
      } else if (rule.type === 'consistency') {
        const vals = (rule.keys || []).map((k) => Number(scope[k])).filter((n) => isFinite(n));
        if (vals.length < 2) return;
        const mean = vals.reduce((s, n) => s + n, 0) / vals.length;
        const max = Math.max.apply(null, vals);
        const min = Math.min.apply(null, vals);
        const rel = mean === 0 ? Infinity : Math.abs(max - min) / Math.abs(mean);
        vars.value = (rel * 100).toFixed(2);
        if (rel > rule.relTol) {
          failed = true;
          msg = fill(localized(rule.msg), vars);
          hint = localized(rule.hint) || '';
        }
      } else if (rule.type === 'sig') {
        const raw = state.rawValues[rule.key];
        if (raw === undefined || raw === '') return;
        const str = String(raw).replace(/^-/, '');
        const decimals = (str.split('.')[1] || '').length;
        const digits = str.replace(/[^0-9]/g, '').replace(/^0+/, '').length;
        vars.value = digits;
        vars.raw = String(raw);
        if (digits > (rule.sig || 4) + 1 && decimals > (rule.sig || 4) + 1) {
          failed = true;
          msg = fill(localized(rule.msg), vars);
          hint = localized(rule.hint) || '';
          fix = { key: rule.key, value: Number(str), note: t('calc.precision') + ' ' + (rule.sig || 4) };
        }
      }
    } catch (err) {
      return;
    }

    if (failed && msg) {
      issues.push(Object.assign({}, base, { message: msg, hint, fix }));
    } else {
      passed.push(base);
    }
  });

  return { issues, passed, total: rules.length };
}

function severityRank(l) { return l === 'error' ? 0 : l === 'warn' ? 1 : 2; }

// 智能纠错：当派生量超出范围时，回溯其依赖的输入量，尝试数量级修正并试算
function collectInputDeps(exp, key, seen) {
  seen = seen || {};
  if (seen[key]) return [];
  seen[key] = true;
  const d = (exp.derived || []).find((x) => x.key === key);
  if (!d) return [];
  let vars = [];
  try { vars = collectVars(compile(d.expr)); } catch (e) { return []; }
  const out = [];
  vars.forEach((v) => {
    if ((exp.inputs || []).some((i) => i.key === v)) out.push(v);
    else if ((exp.derived || []).some((x) => x.key === v)) out.push.apply(out, collectInputDeps(exp, v, seen));
  });
  return out;
}
function findScaleFix(exp, rule) {
  const target = rule.key;
  const base = state.values || {};
  const direct = (exp.inputs || []).some((i) => i.key === target);
  const candidates = direct ? [target] : collectInputDeps(exp, target, []);
  const factors = [0.001, 1000, 0.000001, 1000000, 0.01, 100];
  for (let ci = 0; ci < candidates.length; ci++) {
    const key = candidates[ci];
    const raw = Number(base[key]);
    if (!isFinite(raw) || raw === 0) continue;
    for (let fi = 0; fi < factors.length; fi++) {
      const f = factors[fi];
      const trial = Object.assign({}, base);
      trial[key] = raw * f;
      let c;
      try { c = computeExperiment(exp, trial); } catch (e) { continue; }
      const v = c.scope[target];
      if (isFinite(v) && v >= rule.min && v <= rule.max) {
        return { key, factor: f, value: trial[key], note: '×' + f };
      }
    }
  }
  return null;
}

const OCR = {
  provider: null,
  channels: [],
  register(provider) {
    if (!provider || typeof provider.recognize !== 'function') throw new Error('Provider must implement recognize()');
    this.provider = provider;
    this.channels.push({ name: provider.name || 'custom', demo: false });
    return true;
  },
  async recognize(image, exp) {
    if (this.provider && this.provider.recognize) {
      return await this.provider.recognize(image, exp);
    }
    return await demoRecognize(image, exp);
  }
};

function seedOf(str) {
  let h = 2166136261;
  for (let i = 0; i < String(str).length; i++) { h ^= String(str).charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function seeded(n) {
  const x = Math.sin(n * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

async function demoRecognize(image, exp) {
  const seed = seedOf((image && image.length || '') + exp.id + Date.now());
  await new Promise((r) => setTimeout(r, 900 + seeded(seed) * 700));
  const cells = (exp.inputs || []).map((inp, idx) => {
    const jitter = inp.constant ? 0 : (seeded(seed + idx * 17) - 0.5) * 0.012;
    const v = Number(inp.value) * (1 + jitter);
    const decimals = Math.max(0, Math.min(6, (inp.sig || 3) - 1 - Math.floor(Math.log10(Math.abs(inp.value) || 1))));
    const raw = v.toFixed(decimals);
    const lowIdx = (exp.inputs || []).filter((x) => !x.constant)[1] || exp.inputs[1];
    let conf = 0.86 + seeded(seed + idx * 31) * 0.12;
    if (inp === lowIdx && idx > 0) conf = 0.58 + seeded(seed + 7) * 0.14;
    if (inp.constant) conf = 0.99;
    return {
      key: inp.key,
      raw: raw,
      value: Number(raw),
      confidence: Number(conf.toFixed(2)),
      status: conf < 0.75 ? 'low' : 'ok'
    };
  });
  return { cells, provider: 'demo', meta: { engine: 'demo-recognizer', language: 'mixed-handwriting' } };
}

// ----------------------------------------------------------
// 8b. 文件解析：DOCX（纯前端 ZIP+XML）、PDF（按需 pdf.js）、图片
//     全部在浏览器本地完成，失败时返回结构化错误供手动兜底。
// ----------------------------------------------------------
function zipU16(b, o) { return b[o] | (b[o + 1] << 8); }
function zipU32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

function readZipEntries(buf) {
  const b = new Uint8Array(buf);
  let eocd = -1;
  for (let i = b.length - 22; i >= Math.max(0, b.length - 65558); i--) {
    if (zipU32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip-eocd');
  const count = zipU16(b, eocd + 10);
  const cdOff = zipU32(b, eocd + 16);
  const map = {};
  let p = cdOff;
  for (let n = 0; n < count; n++) {
    if (zipU32(b, p) !== 0x02014b50) break;
    const method = zipU16(b, p + 10);
    const compSize = zipU32(b, p + 20);
    const nameLen = zipU16(b, p + 28);
    const extraLen = zipU16(b, p + 30);
    const commentLen = zipU16(b, p + 32);
    const localOff = zipU32(b, p + 42);
    const name = new TextDecoder().decode(b.slice(p + 46, p + 46 + nameLen));
    const lNameLen = zipU16(b, localOff + 26);
    const lExtraLen = zipU16(b, localOff + 28);
    map[name] = { method, compSize, dataStart: localOff + 30 + lNameLen + lExtraLen };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { bytes: b, map };
}

async function unzipEntry(zip, name) {
  const e = zip.map[name];
  if (!e) return null;
  const raw = zip.bytes.slice(e.dataStart, e.dataStart + e.compSize);
  if (e.method === 0) return new TextDecoder().decode(raw);
  if (e.method === 8) {
    if (typeof DecompressionStream === 'undefined') throw new Error('no-deflate');
    const ds = new DecompressionStream('deflate-raw');
    const out = await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(out);
  }
  throw new Error('zip-method');
}

function docxXmlToText(xml) {
  let s = xml
    .replace(/<w:tab[^>]*\/>/g, '\t')
    .replace(/<\/w:p>/g, '\n')
    .replace(/<\/w:tc>/g, ' | ')
    .replace(/<\/w:tr>/g, '\n');
  s = s.replace(/<w:t[^>]*>/g, '').replace(/<\/w:t>/g, '');
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ');
  return s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

async function parseDocxFile(file) {
  const zip = readZipEntries(await file.arrayBuffer());
  const xml = await unzipEntry(zip, 'word/document.xml');
  if (!xml) throw new Error('docx-no-document');
  return docxXmlToText(xml);
}

let pdfjsPromise = null;
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  if (!pdfjsPromise) {
    pdfjsPromise = (async () => {
      const mod = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs');
      try { mod.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.worker.min.mjs'; } catch (e) { /* 使用主线程降级 */ }
      return mod;
    })();
  }
  return pdfjsPromise;
}

async function parsePdfFile(file) {
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({ data: buf, isEvalSupported: false }).promise;
  const pages = Math.min(doc.numPages, 40);
  const chunks = [];
  for (let p = 1; p <= pages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const line = content.items.map((it) => it.str).join(' ');
    chunks.push(line.replace(/\s+/g, ' ').trim());
  }
  return chunks.join('\n');
}

async function extractFileText(file) {
  const name = String(file && file.name || '').toLowerCase();
  if (/\.docx$/.test(name)) return { text: await parseDocxFile(file), kind: 'docx' };
  if (/\.pdf$/.test(name)) return { text: await parsePdfFile(file), kind: 'pdf' };
  if (/\.(png|jpe?g|webp|bmp)$/.test(name)) return { text: '', kind: 'image' };
  if (/\.(txt|md|markdown)$/.test(name)) return { text: await file.text(), kind: 'text' };
  if (/\.doc$/.test(name)) throw new Error('legacy-doc');
  throw new Error('unsupported-format');
}

function cleanHeading(line) {
  return String(line)
    .replace(/^[\s|]+|[\s|]+$/g, '')
    .replace(/^[0-9一二三四五六七八九十]+[.、)．]\s*/, '')
    .replace(/^[IVX]+[.、]\s*/, '')
    .replace(/^[（(][0-9一二三四五六七八九十]+[）)]\s*/, '')
    .trim();
}

const HEADING_PATTERNS = [
  { key: 'title', re: /^(report title|experiment title|实验名称|报告标题)$/i },
  { key: 'objective', re: /^(experimental objectives?|objectives?|实验目的|实验目标|目的)/i },
  { key: 'instruments', re: /^(name of experimental instruments?|instruments?|apparatus|equipment|实验仪器|实验器材|仪器)/i },
  { key: 'principle', re: /^(experimental principles?( and procedures?)?|principles?|theory|实验原理|原理)/i },
  { key: 'steps', re: /^(procedures?|experimental (content|steps?|procedures?)|实验步骤|实验内容|步骤)/i },
  { key: 'data', re: /^(data (records?|recording)|experimental data|数据记录|实验数据|数据表)/i },
  { key: 'processing', re: /^(data processing( and discussion)?|数据处理|误差分析)/i },
  { key: 'questions', re: /^(answering questions?( and experiment summary)?|questions?( and answers?)?|thinking questions|discussion questions|思考题|总结)/i },
  { key: 'original', re: /^(original experimental data( record)?|原始数据记录)/i },
  { key: 'conclusion', re: /^(conclusions?|结论)/i }
];

function detectTemplateSections(text) {
  const lines = String(text || '').split(/\n/).map((l) => l.trim()).filter(Boolean);
  const out = [];
  const seen = {};
  lines.forEach((line) => {
    if (line.length > 80) return;
    const h = cleanHeading(line);
    for (let i = 0; i < HEADING_PATTERNS.length; i++) {
      const p = HEADING_PATTERNS[i];
      if (!seen[p.key] && p.re.test(h)) {
        seen[p.key] = 1;
        out.push({ key: p.key, title: { zh: h, en: h }, enabled: true });
        break;
      }
    }
  });
  return out.filter((s) => s.key !== 'title').length >= 2 ? out : null;
}

function defaultTemplateSections() {
  return ['title', 'objective', 'principle', 'instruments', 'steps', 'data', 'calc', 'processing', 'error', 'conclusion', 'questions', 'confirm']
    .map((k) => ({ key: k, enabled: true }));
}

const CONTENT_KEYS = {
  objective: /^(experimental objectives?|objectives?|实验目的|实验目标)/i,
  principle: /^(experimental principles?|principles?|theory|实验原理|原理)/i,
  instruments: /^(instruments?|apparatus|equipment|实验仪器|实验器材)/i,
  steps: /^(procedures?|experimental (content|steps?|procedures?)|实验步骤|实验内容)/i,
  data: /^(data (records?|recording)|experimental data|数据记录|实验数据|数据表)/i
};

// 从文本提取数据表字段：逗号字段行（key, 名称, 单位, 值）或「|」表格数值行
function detectInputFields(text) {
  const out = [];
  const seen = {};
  String(text || '').split('\n').forEach((rawLine) => {
    const line = rawLine.trim();
    if (!line || line.length > 120) return;
    let key = '', label = '', unit = '', val = '';
    if (line.indexOf('|') >= 0) {
      const cells = line.split('|').map((c) => c.trim()).filter(Boolean);
      if (cells.length >= 3 && /^[A-Za-z][A-Za-z0-9_]*$/.test(cells[0])) {
        const numIdx = cells.findIndex((c, i) => i > 0 && /^-?[0-9]+(\.[0-9]+)?$/.test(c));
        if (numIdx > 0) {
          key = cells[0];
          label = cells[1] !== key ? cells[1] : key;
          val = cells[numIdx];
          unit = (numIdx + 1 < cells.length && !/^[0-9.]+$/.test(cells[numIdx + 1])) ? cells[numIdx + 1] : '';
        }
      }
    } else if (/[,，]/.test(line)) {
      const cells = line.split(/[,，]/).map((c) => c.trim());
      if (cells.length >= 4 && /^[A-Za-z][A-Za-z0-9_]*$/.test(cells[0]) && /^-?[0-9]+(\.[0-9]+)?$/.test(cells[3])) {
        key = cells[0];
        label = cells[1];
        unit = cells[2];
        val = cells[3];
      }
    }
    if (key && !seen[key]) {
      seen[key] = 1;
      out.push({
        key: key,
        symbol: key,
        label: { zh: label || key, en: label || key },
        unit: unit || '',
        value: Number(val) || 1,
        range: [0, 1e6],
        sig: 4
      });
    }
  });
  return out.slice(0, 12);
}

// 从公式行提取待计算量：A = expr（expr 可编译且变量来自已识别输入量或常量）
function detectDerivedFromFormulas(formulas, inputs) {
  const inputKeys = {};
  (inputs || []).forEach((i) => { inputKeys[i.key] = 1; });
  const out = [];
  const seen = {};
  (formulas || []).forEach((f) => {
    const m = String(f).match(/^([A-Za-z][A-Za-z0-9_]*)\s*=\s*(.+)$/);
    if (!m) return;
    const key = m[1];
    const expr = m[2].trim().replace(/[；;。，,]+$/, '');
    if (seen[key] || !expr || expr.length > 90) return;
    let vars = [];
    try { vars = collectVars(compile(expr)); } catch (e) { return; }
    const unknown = vars.filter((v) => !inputKeys[v] && !(v in CONSTS));
    if (unknown.length) return;
    seen[key] = 1;
    out.push({
      key: key,
      symbol: key,
      label: { zh: key, en: key },
      unit: '',
      expr: expr,
      sig: 4,
      highlight: out.length === 0
    });
  });
  return out.slice(0, 8);
}

function parseExperimentContent(text, fileName) {
  const raw = String(text || '');
  const lines = raw.split(/\n/).map((l) => l.trim()).filter(Boolean);
  let title = '';
  for (let i = 0; i < Math.min(lines.length, 8); i++) {
    const l = lines[i];
    if (/^experiment[:\s]/i.test(l) || /^实验[一二三四五六七八九十0-9]|实验[:：]/.test(l)) { title = l.replace(/^experiment[:\s]*/i, '').replace(/^实验[一二三四五六七八九十0-9]*[:：\s]*/, '').trim(); break; }
  }
  if (!title && lines.length) title = lines[0].slice(0, 80);
  if (!title) title = String(fileName || '').replace(/\.[^.]+$/, '');
  const isZh = /[\u4e00-\u9fa5]/.test(raw.slice(0, 800));
  const buckets = { objective: [], principle: [], instruments: [], steps: [], data: [] };
  let current = '';
  lines.forEach((line) => {
    const h = cleanHeading(line);
    let matched = '';
    Object.keys(CONTENT_KEYS).forEach((k) => { if (!matched && CONTENT_KEYS[k].test(h)) matched = k; });
    if (matched) { current = matched; return; }
    if (current) buckets[current].push(line);
  });
  const formulas = lines.filter((l) => l.length < 90 && l.indexOf('=') > 0 && !/table|figure|如图|见表/i.test(l)).slice(0, 10);
  const put = (arr) => isZh ? { zh: arr, en: arr.slice() } : { zh: arr.slice(), en: arr };
  const detectedInputs = detectInputFields(raw);
  const detectedDerived = detectDerivedFromFormulas(formulas, detectedInputs);
  return {
    title: { zh: isZh ? title : '', en: isZh ? '' : title },
    aims: put(buckets.objective),
    principle: isZh ? { zh: buckets.principle.join('\n'), en: buckets.principle.join('\n') } : { zh: buckets.principle.join('\n'), en: buckets.principle.join('\n') },
    instruments: put(buckets.instruments),
    steps: put(buckets.steps),
    formulas: formulas,
    inputs: detectedInputs.length ? detectedInputs : [{ key: 'x', symbol: 'x', label: { zh: '测量量', en: 'Measured quantity' }, unit: '', value: 1, range: [0, 1000], sig: 4 }],
    derived: detectedDerived.length ? detectedDerived : [{ key: 'y', symbol: 'y', label: { zh: '计算结果', en: 'Result' }, unit: '', expr: 'x', sig: 4, highlight: true }],
    detected: { inputs: detectedInputs.length, derived: detectedDerived.length },
    sourceName: fileName || '',
    rawText: raw.slice(0, 6000)
  };
}

  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 260);
  }, 2600);
}

function t(key, vars) {

  let s = dict[key];
  if (s === undefined) s = (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
  return vars ? fill(s, vars) : s;
}

function paintChrome() {
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  document.documentElement.dataset.lang = state.lang;
  $('#brandZh').textContent = state.lang === 'zh' ? '实验小助手' : 'Lab Copilot';
  $('#brandSub').textContent = t('brand.sub');
  $('#navHome').textContent = t('nav.home');
  $('#navWorkspace').textContent = t('nav.workspace');
  $('#navLibrary').textContent = t('nav.library');
  $('#navTemplates').textContent = t('nav.templates');
  $('#navHelp').textContent = t('nav.help');
  $('#btnQuickStart').textContent = t('nav.quick');
  $('#footerCopy').textContent = t('footer.copy');
  $('#footLibrary').textContent = t('nav.library');
  $('#footTemplates').textContent = t('nav.templates');
  $('#footHelp').textContent = t('nav.help');
  $('#footTop').textContent = t('footer.top');
  $$('[data-set-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setLang === state.lang)));
  $$('.nav-link[data-nav]').forEach((b) => b.classList.toggle('active', b.dataset.nav === state.view));
  document.title = state.lang === 'zh' ? '实验小助手 · 物理实验报告智能生成' : 'Lab Copilot · Intelligent Physics Lab Reports';
}

function render(opts) {
  paintChrome();
  const main = $('#main');
  const view = state.view;
  if (view === 'home') main.innerHTML = renderHome();
  else if (view === 'workspace') main.innerHTML = renderWorkspace();
  else if (view === 'library') main.innerHTML = renderLibrary();
  else if (view === 'templates') main.innerHTML = renderTemplates();
  else if (view === 'help') main.innerHTML = renderHelp();
  if (opts && opts.keepScroll !== true) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
