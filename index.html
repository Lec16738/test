// ---------- 工作台 ----------
function renderWorkspace() {
  return '<div class="view"><div class="shell workspace">' +
    '<aside class="stepper no-print"><div class="stepper-label">' + esc(t('step.label')) + '</div><ol class="steps">' +
      [1, 2, 3, 4, 5].map((n) => {
        const isDone = state.step > n;
        const locked = n > 2 && !state.experimentId;
        return '<li class="step ' + (state.step === n ? 'active' : '') + (isDone ? ' done' : '') + (locked ? ' locked' : ' clickable') + '" data-step-go="' + n + '">' +
          '<span class="step-dot">' + (isDone ? ICON.check : '0' + n) + '</span>' +
          '<span class="step-body"><b>' + esc(t('step.' + n + '.t')) + '</b><span>' + esc(t('step.' + n + '.d')) + '</span></span></li>';
      }).join('') +
    '</ol><button class="stepper-link" data-nav="library">' + ICON.edit + esc(t('nav.library')) + '</button></aside>' +
    '<section>' + renderStep() + '</section>' +
  '</div></div>';
}

function renderStep() {
  if (state.step === 1) return renderStep1();
  if (state.step === 2) return renderStep2();
  if (state.step === 3) return renderStep3();
  if (state.step === 4) return renderStep4();
  return renderStep5();
}

// --- Step 1 ---
function renderStep1() {
  const q = state.filters.q.trim().toLowerCase();
  const cat = state.filters.cat;
  const exps = allExperiments().filter((e) => {
    if (cat !== 'all' && e.category !== cat) return false;
    if (!q) return true;
    const hay = [e.id, e.title.zh, e.title.en, e.short && e.short.zh, e.short && e.short.en].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  const selected = currentExperiment();
  return '<div class="panel">' +
    '<div class="panel-head"><div><div class="kicker">STEP 01</div><h2>' + esc(t('step.1.t')) + '</h2><p>' + esc(t('exp.searchPlaceholder')) + '</p></div>' +
      '<div class="head-actions"><span class="pill physics">' + esc(t('common.physics')) + ' ' + BUILTIN_EXPERIMENTS.filter((e) => e.category === 'physics').length + '</span><span class="pill telecom">' + esc(t('common.telecom')) + ' ' + BUILTIN_EXPERIMENTS.filter((e) => e.category === 'telecom').length + '</span><button class="btn btn-ghost btn-sm" data-imp-open>' + ICON.flask + esc(t('imp.title')) + '</button></div>' +
    '</div>' +
    '<div class="panel-body">' +
      '<div class="searchbar"><input id="expSearch" type="search" placeholder="' + esc(t('exp.searchPlaceholder')) + '" value="' + esc(state.filters.q) + '" autocomplete="off">' +
        '<div class="filters">' +
          [['all', t('exp.filter.all')], ['physics', t('exp.filter.physics')], ['telecom', t('exp.filter.telecom')], ['custom', t('exp.filter.custom')]].map(([k, label]) =>
            '<button class="chip-btn" data-filter-cat="' + k + '" aria-pressed="' + (cat === k) + '">' + esc(label) + '</button>'
          ).join('') +
        '</div>' +
      '</div>' +
      '<div class="exp-grid" id="expGrid">' + (exps.length ? exps.map(renderExpCard).join('') : '<div class="empty-state" style="grid-column:1/-1"><h4>' + esc(t('exp.empty')) + '</h4></div>') + '</div>' +
      (selected ? renderExpSummary(selected) : '<div class="callout" style="margin-top:16px">' + esc(t('exp.selectHint')) + '</div>') +
    '</div>' +
    '<div class="panel-foot">' +
      '<div class="foot-note">' + ICON.info + esc(t('exp.customHint')) + '</div>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" data-next="1" ' + (selected ? '' : 'disabled') + '>' + esc(t('common.next')) + ICON.arrow + '</button>' +
    '</div>' +
  '</div>';
}

function renderExpCard(exp) {
  const cat = exp.category || 'custom';
  const meta = CATEGORY_META[cat] || CATEGORY_META.custom;
  const alt = state.lang === 'zh' ? (exp.title.en || '') : (exp.title.zh || '');
  return '<button class="exp-card" data-select-exp="' + esc(exp.id) + '" aria-pressed="' + (state.experimentId === exp.id) + '">' +
    '<span class="cat"><span class="pill ' + meta.cls + '">' + esc(t(meta.key)) + '</span><span style="display:flex;align-items:center;gap:5px"><span class="tpl-badge">' + esc(t(sourceTypeOf(exp) === 'extension' ? 'source.extension' : 'source.manual')) + '</span><span class="ver">v' + esc(exp.version || '1.0.0') + '</span></span></span>' +
    '<h3>' + esc(L(exp.title)) + '</h3>' +
    '<span class="en">' + esc(alt) + '</span>' +
    '<span class="meta"><span>' + (exp.inputs || []).length + ' ' + esc(t('common.inputs')) + '</span><span>' + (exp.derived || []).length + ' ' + esc(t('common.derived')) + '</span><span>' + (exp.checks || []).length + ' ' + esc(t('common.checks')) + '</span></span>' +
    '<span class="check">' + ICON.check + '</span>' +
  '</button>';
}

function renderExpSummary(exp) {
  const inputs = (exp.inputs || []).map((i) => esc(i.symbol || i.key) + ' ' + esc(L(i.label))).join(state.lang === 'zh' ? '、' : ', ');
  return '<div class="exp-summary">' +
    '<div class="exp-summary-head"><span class="pill ' + (CATEGORY_META[exp.category] || CATEGORY_META.custom).cls + '">' + esc(t((CATEGORY_META[exp.category] || CATEGORY_META.custom).key)) + '</span><h3>' + esc(L(exp.title)) + '</h3><span class="badge-sm info">' + esc(t('exp.selected')) + '</span></div>' +
    '<div class="exp-summary-body">' +
      '<div><p>' + esc(L(exp.principle)) + '</p><div class="formula-strip">' + (exp.formulas || []).map((f) => '<code>' + esc(f) + '</code>').join('') + '</div></div>' +
      '<ul class="exp-meta-list">' +
        '<li><span>' + esc(t('exp.inputCount')) + '</span><b>' + (exp.inputs || []).length + '</b></li>' +
        '<li><span>' + esc(t('exp.derivedCount')) + '</span><b>' + (exp.derived || []).length + '</b></li>' +
        '<li><span>' + esc(t('exp.checkCount')) + '</span><b>' + (exp.checks || []).length + '</b></li>' +
        '<li><span>' + esc(t('exp.meta.source')) + '</span><b style="max-width:190px">' + esc(L(exp.source)) + '</b></li>' +
      '</ul>' +
    '</div>' +
    '<div class="sig-note" style="margin-top:14px">' + ICON.info + esc(inputs) + '</div>' +
  '</div>';
}

// --- Step 2 ---
function renderStep2() {
  const exp = currentExperiment();
  if (!exp) return renderNoExp();
  const ocr = state.ocr;
  const img = ocr.image;
  return '<div class="panel">' +
    '<div class="panel-head"><div><div class="kicker">STEP 02</div><h2>' + esc(t('upload.title')) + '</h2><p>' + esc(t('upload.desc')) + '</p></div>' +
      '<div class="head-actions"><span class="badge-sm info">' + esc(t('upload.provider')) + ': ' + esc(t('upload.providerDemo')) + '</span></div></div>' +
    '<div class="panel-body">' +
      '<div class="upload-grid">' +
        '<div>' + (img ? renderPreview(img, ocr) : renderDropzone()) + '</div>' +
        '<div>' +
          renderUploadSide(exp, ocr) +
        '</div>' +
      '</div>' +
      (ocr.recognized ? renderOcrTable(exp) : '') +
      (ocr.manualMode ? renderManualTable(exp) : '') +
    '</div>' +
    '<div class="panel-foot">' +
      '<button class="btn btn-ghost btn-sm" data-back="2">' + ICON.back + esc(t('common.back')) + '</button>' +
      '<div class="foot-note">' + ICON.info + esc(t('upload.hint')) + '</div>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" data-next="2" ' + ((ocr.recognized || ocr.manualMode) ? '' : 'disabled') + '>' + esc(t('common.next')) + ICON.arrow + '</button>' +
    '</div>' +
    '<input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">' +
    '<input type="file" id="fileAlbum" accept="image/*" class="hidden">' +
  '</div>';
}

function renderNoExp() {
  return '<div class="panel"><div class="panel-body"><div class="empty-state"><div class="es-ico">' + ICON.flask + '</div><h4>' + esc(t('exp.selectHint')) + '</h4><p></p></div></div>' +
    '<div class="panel-foot"><button class="btn btn-primary" data-step-go="1">' + esc(t('step.1.t')) + ICON.arrow + '</button></div></div>';
}

function renderDropzone() {
  return '<div class="dropzone" id="dropzone">' +
    '<div class="dz-ico">' + ICON.camera + '</div>' +
    '<h4>' + esc(t('upload.dropTitle')) + '</h4>' +
    '<p>' + esc(t('upload.dropDesc')) + '</p>' +
    '<div class="dz-actions">' +
      '<button class="btn btn-primary btn-sm" data-open-camera>' + ICON.camera + esc(t('upload.camera')) + '</button>' +
      '<button class="btn btn-ghost btn-sm" data-open-album>' + ICON.image + esc(t('upload.album')) + '</button>' +
      '<button class="btn btn-soft btn-sm" data-demo-image>' + ICON.spark + esc(t('upload.demo')) + '</button>' +
    '</div>' +
    '<span class="hint-line">' + esc(t('upload.hint')) + '</span>' +
  '</div>';
}

function renderPreview(img, ocr) {
  return '<div class="preview-box">' +
    '<div class="preview-head"><span class="dot"></span><span>' + esc(t('upload.preview')) + '</span><span class="name">' + esc(ocr.fileName || 'capture.png') + '</span>' +
      (ocr.imageInfo ? '<span class="size-info">' + esc(fill(t('upload.info'), { from: fmtKB(ocr.imageInfo.originalKB), to: fmtKB(ocr.imageInfo.sizeKB), w: ocr.imageInfo.width, h: ocr.imageInfo.height })) + '</span>' : '') + '</div>' +
    '<div class="preview-img-wrap ' + (ocr.busy ? 'scan-overlay' : '') + '">' + (ocr.busy ? '<div class="scan-line"></div>' : '') + '<img src="' + img + '" alt="preview"></div>' +
    '<div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fff">' +
      '<button class="btn btn-ghost btn-sm" data-open-album>' + esc(t('upload.replace')) + '</button>' +

function renderOcrTable(exp) {
  const cells = state.ocr.cells;
  const rows = (exp.inputs || []).map((inp) => {
    const cell = cells.find((c) => c.key === inp.key) || { raw: '', value: '', confidence: 0, status: 'low' };
    const conf = Number(cell.confidence);
    const cls = conf >= 0.85 ? 'high' : conf >= 0.75 ? 'mid' : 'low';
    const statusBadge = conf < 0.75
      ? '<span class="badge-sm low">' + esc(t('upload.lowConf')) + '</span>'
      : '<span class="badge-sm ok">' + esc(t('upload.verified')) + '</span>';
    return '<tr data-ocr-row="' + esc(inp.key) + '">' +
      '<td>' + esc(L(inp.label)) + '</td>' +
      '<td><span class="sym">' + esc(inp.symbol || inp.key) + '</span></td>' +
      '<td><input class="cell-input ' + (conf < 0.75 ? 'low' : '') + '" data-ocr-input="' + esc(inp.key) + '" value="' + esc(cell.raw) + '" inputmode="decimal"></td>' +
      '<td><span class="unit-tag">' + esc(inp.unit || '—') + '</span></td>' +
      '<td><div class="conf ' + cls + '"><span class="conf-bar"><i style="width:' + Math.round(conf * 100) + '%"></i></span><b>' + Math.round(conf * 100) + '%</b></div></td>' +
      '<td>' + statusBadge + '</td>' +
    '</tr>';
  }).join('');
  return '<div style="margin-top:22px">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap"><h4 style="font-size:14px">' + esc(t('upload.resultTitle')) + '</h4><span class="sig-note">' + esc(t('upload.resultDesc')) + '</span></div>' +
    '<div class="table-wrap"><table class="data"><thead><tr><th>' + esc(t('report.table.quantity')) + '</th><th>' + esc(t('common.symbol')) + '</th><th>' + esc(t('report.table.measured')) + '</th><th>' + esc(t('common.unit')) + '</th><th>' + esc(t('common.confidence')) + '</th><th>' + esc(t('upload.verified')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
  '</div>';
}

// --- Step 3 ---
function renderStep3() {
  const exp = currentExperiment();
  if (!exp) return renderNoExp();

  const checkRes = runChecks(exp, comp.scope);

    const raw = state.rawValues[inp.key] !== undefined ? state.rawValues[inp.key] : (state.values[inp.key] !== undefined ? state.values[inp.key] : inp.value);

    '<div class="panel-head"><div><div class="kicker">STEP 03</div><h2>' + esc(t('calc.title')) + '</h2><p>' + esc(t('calc.desc')) + '</p></div>' +
      '<div class="head-actions"><span class="badge-sm ' + (checkRes.issues.length ? 'info' : 'ok') + '">' + esc(checkRes.issues.length ? t('check.issueCount', { n: checkRes.issues.length }) : t('check.allPass')) + '</span></div></div>' +
    '<div class="panel-body">' +

      '</div>' +
      '<div class="calc-grid">' +
        '<div class="calc-block"><h4>' + esc(t('calc.base')) + '<span class="count">' + (exp.inputs || []).length + '</span></h4>' +
          '<div class="table-wrap"><table class="data compact"><thead><tr><th>' + esc(t('report.table.quantity')) + '</th><th>' + esc(t('common.symbol')) + '</th><th>' + esc(t('report.table.measured')) + '</th><th>' + esc(t('common.unit')) + '</th></tr></thead><tbody>' + baseRows + '</tbody></table></div>' +
          '<div class="sig-note" style="margin-top:8px">' + esc(t('calc.editHint')) + '</div>' +
        '</div>' +

          '<div class="table-wrap"><table class="data compact"><thead><tr><th>' + esc(t('report.table.quantity')) + '</th><th>' + esc(t('common.symbol')) + '</th><th>' + esc(t('report.table.result')) + '</th><th style="text-align:right">' + esc(t('calc.process')) + '</th></tr></thead><tbody>' + derivedRows + '</tbody></table></div>' +

// --- Step 4 ---
function renderStep4() {
  const exp = currentExperiment();
  if (!exp) return renderNoExp();
  const comp = computeExperiment(exp, state.values);
  const res = runChecks(exp, comp.scope);
  const errs = res.issues.filter((i) => i.level === 'error').length;
  const warns = res.issues.filter((i) => i.level === 'warn').length;
  const infos = res.issues.filter((i) => i.level === 'info').length;
  const fixable = res.issues.filter((i) => i.fix).length;
  const sorted = res.issues.slice().sort((a, b) => severityRank(a.level) - severityRank(b.level));
  const list = sorted.length ? sorted.map((it, i) =>
    '<div class="issue ' + it.level + '"><div class="issue-ico">' + (it.level === 'error' ? '!' : it.level === 'warn' ? '!' : 'i') + '</div>' +
    '<div class="issue-main"><b>' + esc(it.title) + '</b><p>' + esc(it.message) + '</p>' +
      (it.hint ? '<div class="suggest">' + esc(t('check.suggestion')) + '：' + esc(it.hint) + '</div>' : '') +
      '<div class="issue-meta">' + esc(t('common.rule')) + ' · ' + esc(it.type) + (it.level ? ' · ' + esc(t('check.severity.' + it.level)) : '') + '</div>' +
    '</div>' +
    (it.fix ? '<div class="issue-action"><button class="btn btn-amber btn-sm" data-apply-fix="' + i + '" data-fix="' + esc(JSON.stringify(it.fix)) + '">' + esc(t('check.fix')) + '</button></div>' : '') +
    '</div>'
  ).join('') : '<div class="empty-state"><div class="es-ico">' + ICON.check + '</div><h4>' + esc(t('check.emptyTitle')) + '</h4><p>' + esc(t('check.emptyDesc')) + '</p></div>';
  return '<div class="panel">' +
    '<div class="panel-head"><div><div class="kicker">STEP 04</div><h2>' + esc(t('check.title')) + '</h2><p>' + esc(t('check.desc')) + '</p></div>' +
      '<div class="head-actions"><button class="btn btn-ghost btn-sm" data-rerun-checks>' + ICON.spark + esc(t('check.run')) + '</button></div></div>' +
    '<div class="panel-body">' +
      '<div class="issue-summary">' +
        '<div class="issue-stat error"><b>' + errs + '</b><span>' + esc(t('check.summary.error')) + '</span></div>' +
        '<div class="issue-stat warn"><b>' + (warns + infos) + '</b><span>' + esc(t('check.summary.warn')) + '</span></div>' +
        '<div class="issue-stat ok"><b>' + res.passed.length + '</b><span>' + esc(t('check.summary.ok')) + '</span></div>' +
      '</div>' +
      '<div class="issue-list">' + list + '</div>' +
      (fixable ? '<div class="callout" style="margin-top:16px">' + esc(t('check.fix')) + ' · ' + fixable + ' · ' + esc(t('check.autoNote')) + '</div>' : '<div class="callout" style="margin-top:16px">' + esc(t('check.autoNote')) + '</div>') +
    '</div>' +
    '<div class="panel-foot">' +
      '<button class="btn btn-ghost btn-sm" data-back="4">' + ICON.back + esc(t('common.back')) + '</button>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" data-next="4">' + esc(t('common.next')) + ICON.arrow + '</button>' +
    '</div>' +
  '</div>';
}

// --- Step 5 ---

const TPL_FORMATS = ['pdf', 'docx', 'png', 'jpg', 'jpeg', 'webp'];

// 从解析文本中提取表格样式：以「|」分隔的行推断最大列数
function detectTableColumns(text) {
  const rows = String(text || '').split('\n').filter((l) => l.indexOf('|') >= 0);
  let max = 0;
  rows.forEach((l) => {
    const n = l.split('|').filter((x) => x.trim()).length;
    if (n > max) max = n;
  });
  return (max >= 2 && max <= 12) ? max : 0;
}

async function handleTplFile(file) {
  if (!file) return;
  const name = file.name || 'template';
  const ext = (String(name).toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
  if (ext === 'doc') { toast(t('tpl.err.legacyDoc'), 'err'); return; }
  if (TPL_FORMATS.indexOf(ext) < 0) { toast(fill(t('tpl.err.format'), { ext: ext || '?' }), 'err'); return; }
  const p = {
    name: name.replace(/\.[^.]+$/, ''),
    lang: 'mixed',
    appliesTo: 'all',
    sections: defaultTemplateSections(),
    fileName: name,
    hint: '',
    tableColumns: 0,
    editingId: null
  };
  state.pendingTemplate = p;
  openModal(renderTplUploadModal());
  try {
    if (['png', 'jpg', 'jpeg', 'webp'].indexOf(ext) >= 0) {
      let text = '';
      if (OCR.provider && typeof OCR.provider.recognize === 'function') {
        try {
          const dataUrl = await UploadClient.blobToDataURL(file);
          const out = await OCR.recognize(dataUrl, { id: '__template__', title: { zh: name, en: name }, inputs: [] });
          text = (out && out.text) || (out && (out.cells || []).map((c) => c.raw).join('\n')) || '';
        } catch (e) { text = ''; }
      }
      const secs = text ? detectTemplateSections(text) : null;
      if (secs && secs.length >= 3) {
        p.sections = secs;
        p.tableColumns = detectTableColumns(text);
        p.hint = t('tpl.ocrImage');
      } else {
        p.hint = t('tpl.upload.imageHint');
      }
      openModal(renderTplUploadModal());
      return;
    }
    const out = await extractFileText(file);
    const secs = detectTemplateSections(out.text);
    if (secs && secs.length >= 3) {
      p.sections = secs;
      p.hint = t('tpl.upload.done');
    } else {
      p.hint = t('tpl.upload.fail');
    }
    p.tableColumns = detectTableColumns(out.text);
    openModal(renderTplUploadModal());
  } catch (err) {
    const msg = String((err && err.message) || '');
    p.hint = err && err.message === 'legacy-doc'
      ? t('tpl.err.legacyDoc')
      : (/pdf|import|fetch|network/i.test(msg) ? t('tpl.upload.pdfHint') : t('tpl.upload.fail'));
    openModal(renderTplUploadModal());
  }
}

function savePendingTemplate() {
  const p = state.pendingTemplate;
  if (!p) return;
  if (!p.name || !p.name.trim()) return toast(t('tpl.parseTitle'), 'warn');
  const secs = p.sections.map((s) => ({ key: s.key, enabled: s.enabled !== false, title: s.title }));
  if (!secs.some((s) => s.enabled !== false)) return toast(t('tpl.noSections'), 'warn');
  const tableStyle = { columns: clamp(Number(p.tableColumns) || 0, 0, 12) };
  if (p.editingId) {
    const tpl = state.templates.find((x) => x.id === p.editingId);
    if (!tpl) { state.pendingTemplate = null; closeModal(); return; }
    pushTemplateVersion(tpl.id, tpl);
    tpl.name = { zh: p.name.trim(), en: p.name.trim() };
    tpl.lang = p.lang || 'mixed';
    tpl.appliesTo = p.appliesTo || 'all';
    tpl.sections = secs;
    tpl.tableStyle = tableStyle;
    tpl.updated = nowStamp();
    state.activeTemplateId = tpl.id;
    state.pendingTemplate = null;
    persist();
    closeModal();
    render();
    toast(t('tpl.saved'), 'ok');
    return;
  }
  const tpl = {
    id: 'tpl-' + Date.now().toString(36),
    name: { zh: p.name.trim(), en: p.name.trim() },
    lang: p.lang || 'mixed',
    appliesTo: p.appliesTo || 'all',
    source: 'upload',
    version: '1.0.0',
    updated: nowStamp(),
    desc: { zh: t('tpl.source.upload'), en: t('tpl.source.upload') },
    sections: secs,
    tableStyle: tableStyle
  };
  state.templates.push(tpl);
  pushTemplateVersion(tpl.id, tpl);
  state.activeTemplateId = tpl.id;
  state.pendingTemplate = null;
  persist();
  closeModal();
  render();
  toast(t('tpl.saved'), 'ok');
}

  draft.sourceName = name;
  draft.title.zh = String(name).replace(/\.[^.]+$/, '');
  state.pendingImport = draft;
  openModal(renderImpModal());
  const applyParsed = (parsed) => {
    Object.assign(draft, parsed);
    draft.inputsRaw = parsed.inputs.map((i) => [i.key, L(i.label), i.unit, i.value].join(', ')).join('\n');
    draft.derivedRaw = parsed.derived.map((d) => [d.key, L(d.label), d.unit, d.expr].join(', ')).join('\n');
  };
  try {
    if (['png', 'jpg', 'jpeg', 'webp'].indexOf(ext) >= 0) {
      let text = '';
      if (OCR.provider && typeof OCR.provider.recognize === 'function') {
        try {
          const dataUrl = await UploadClient.blobToDataURL(file);
          const out = await OCR.recognize(dataUrl, { id: '__import__', title: { zh: name, en: name }, inputs: [] });
          text = (out && out.text) || (out && (out.cells || []).map((c) => c.raw).join('\n')) || '';
        } catch (e) { text = ''; }
      }
      if (text) {
        applyParsed(parseExperimentContent(text, name));
        draft.hint = fill(t('imp.detected'), { n: draft.inputs.length, m: draft.derived.length }) + ' ' + t('imp.ocrImage');
      } else {
        draft.hint = t('imp.ocrImage');
      }
      openModal(renderImpModal());
      return;
    }
    const out = await extractFileText(file);
    const parsed = parseExperimentContent(out.text, name);
    applyParsed(parsed);
    draft.hint = parsed.detected && (parsed.detected.inputs || parsed.detected.derived)
      ? fill(t('imp.detected'), { n: parsed.detected.inputs, m: parsed.detected.derived })
      : t('imp.done');
    openModal(renderImpModal());
  } catch (err) {
    const msg = String((err && err.message) || '');
    draft.hint = err && err.message === 'legacy-doc'
      ? t('imp.err.legacyDoc')
      : (/pdf|import|fetch|network/i.test(msg) ? t('tpl.upload.pdfHint') : t('imp.fail'));
    openModal(renderImpModal());
  }
}

function parseInputRows(text) {
  const rows = String(text || '').split('\n').map((l) => l.split(/[,，]/).map((s) => s.trim())).filter((r) => r.length >= 2 && r[0]);
  if (!rows.length) return blankImportDraft().inputs;
  return rows.map((r) => {
    const key = (r[0] || 'x').replace(/[^A-Za-z0-9_]/g, '') || 'x';
    return {
      key: key,
      symbol: r[0],
      label: { zh: r[1], en: r[1] },
      unit: r[2] || '',
      value: Number(r[3]) || 1,
      range: [0, 1e6],
      sig: 4
    };
  });
}

function parseDerivedRows(text) {
  const rows = String(text || '').split('\n').map((l) => l.split(/[,，]/).map((s) => s.trim())).filter((r) => r.length >= 4 && r[0] && r[3]);
  if (!rows.length) return blankImportDraft().derived;
  return rows.map((r, i) => ({
    key: (r[0] || 'y').replace(/[^A-Za-z0-9_]/g, '') || 'y',
    symbol: r[0],
    label: { zh: r[1], en: r[1] },
    unit: r[2] || '',
    expr: r[3],
    sig: 4,
    highlight: i === 0
  }));
}

function saveImportedExperiment() {
  const p = state.pendingImport;
  if (!p) return;
  const zhTitle = (p.title.zh || '').trim();
  const enTitle = (p.title.en || '').trim();
  if (!zhTitle && !enTitle) return toast(t('imp.needTitle'), 'warn');
  const zh = zhTitle || enTitle;
  const en = enTitle || zhTitle;
  const inputs = parseInputRows(p.inputsRaw);
  const derived = parseDerivedRows(p.derivedRaw);
  const exp = {
    id: 'imp-' + Date.now().toString(36),
    category: 'custom',
    version: '1.0.0',
    sourceType: 'extension',
    source: { zh: t('imp.parsedFrom') + '：' + (p.sourceName || '—'), en: 'Imported from ' + (p.sourceName || '—') },
    title: { zh: zh, en: en },
    short: { zh: zh, en: en },
    aims: { zh: p.aimsZh.length ? p.aimsZh : ['（导入实验，目的待补充）'], en: p.aimsEn.length ? p.aimsEn : (p.aimsZh.length ? p.aimsZh : ['Objective to be completed']) },
    principle: { zh: p.principleZh || '（实验原理待补充）', en: p.principleEn || p.principleZh || 'Principle to be completed' },
    formulas: p.formulas.length ? p.formulas : [],
    instruments: { zh: p.instrZh.length ? p.instrZh : ['待补充'], en: p.instrEn.length ? p.instrEn : (p.instrZh.length ? p.instrZh : ['To be completed']) },
    steps: { zh: p.stepsZh.length ? p.stepsZh : ['待补充实验步骤'], en: p.stepsEn.length ? p.stepsEn : (p.stepsZh.length ? p.stepsZh : ['Procedure to be completed']) },
    inputs: inputs,
    derived: derived,
    checks: [
      { type: 'range', key: derived[0].key, min: -1e12, max: 1e12, level: 'info', msg: { zh: '请补充该实验结果量纲与合理范围。', en: 'Add a plausible range and dimension for this result.' } }
    ],
    errorSources: { zh: ['导入实验，误差来源待补充'], en: ['Imported experiment; error sources to be completed'] },
    questions: { zh: [], en: [] },
    conclusion: { zh: '由配置公式计算得到结果 ' + derived[0].key + ' = {' + derived[0].key + '}。', en: 'The configured formulas give ' + derived[0].key + ' = {' + derived[0].key + '}.' }
  };
  const errs = validateExperiment(exp);
  if (errs.length) return toast(t('library.validateFail') + ' · ' + errs[0], 'err');
  state.customExperiments.push(exp);
  state.pendingImport = null;
  persist();
  closeModal();
  selectExperiment(exp.id, 1);
  toast(t('imp.saved'), 'ok');
}

function reportVars(exp, comp) {
  const vars = {};
  (exp.inputs || []).forEach((inp) => {
    const v = comp.scope[inp.key];
    if (isFinite(v)) vars[inp.key] = fmtNum(v, inp.sig || 3);
  });
  (exp.derived || []).forEach((d) => {
    const r = comp.results.find((x) => x.key === d.key);
    if (r && r.ok) vars[d.key] = r.display;
  });
  if (exp.id === 'am') {
    const ma = comp.scope.ma;
    vars.state = ma > 1 ? (state.lang === 'zh' ? '过调幅' : 'over-modulated') : ma < 0.3 ? (state.lang === 'zh' ? '欠调幅' : 'under-modulated') : (state.lang === 'zh' ? '正常调幅' : 'properly modulated');
    vars.stateEn = ma > 1 ? 'over-modulated' : ma < 0.3 ? 'under-modulated' : 'properly modulated';
  }
  if (exp.id === 'eye') {
    const o = comp.scope.open;
    vars.quality = o >= 50 ? (state.lang === 'zh' ? '良好' : 'good') : o >= 30 ? (state.lang === 'zh' ? '一般' : 'fair') : (state.lang === 'zh' ? '较差' : 'poor');
    vars.qualityEn = o >= 50 ? 'good' : o >= 30 ? 'fair' : 'poor';
  }
  return vars;
}

function rpTable(caption, headers, rows) {
  return '<table class="rp-table">' + (caption ? '<caption>' + esc(caption) + '</caption>' : '') +
    '<thead><tr>' + headers.map((h) => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + r.map((c, i) => '<td' + (i === 3 ? ' class="num"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

function buildObjectiveSection(exp, comp) {
  const zh = state.lang === 'zh';
  const aims = (zh ? exp.aims.zh : exp.aims.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  const f0 = (exp.formulas || [])[0] || '';
  const hi = comp.results.find((r) => r.highlight);
  const lead = zh
    ? '本实验围绕上述目标展开：完成基础量测量后，代入核心公式' + (f0 ? '「' + f0 + '」' : '') + '求解' + (hi ? L(hi.label) : '待求量') + '，并结合校验规则对本次数据的质量与合理性作出评价。'
    : 'The experiment addresses these objectives by measuring the base quantities, substituting them into the key formula' + (f0 ? ' “' + f0 + '”' : '') + ' to obtain ' + (hi ? L(hi.label) : 'the derived quantity') + ', and assessing the quality and plausibility of this run against the validation rules.';
  return '<ol>' + aims + '</ol><p>' + esc(lead) + '</p>';
}

// 问答环节：每题自动生成参考答案，答案模板中的 {变量} 由本次实测数据填充；
// 变量缺失时以 [待补充：xxx数据] 标记，严禁编造数值或使用通用套话。
function buildQnaSection(exp, comp) {
  const zh = state.lang === 'zh';
  const vars = reportVars(exp, comp);
  const qs = zh ? exp.questions.zh : exp.questions.en;
  const ans = ANSWERS[exp.id] || [];
  return qs.map((q, i) => {
    const a = ans[i];
    let body = '';

      body = fill(zh ? a.zh : a.en, vars);
      body = body.replace(/\{([A-Za-z0-9_]+)\}/g, (m, k) => '[' + fill(t('report.missingData'), { field: k }) + ']');
    }
    return '<p><b>Q' + (i + 1) + '：' + esc(q) + '</b></p>' +

        ? '<p><b>' + esc(t('report.qna.answer')) + '：</b>' + esc(body) + '</p><div style="border-bottom:1px dotted #cfc9ba;height:14px;margin:4px 0 10px"></div>'
        : '<p class="rp-note">[' + esc(fill(t('report.qna.pending'), { n: i + 1 })) + ']</p>');
  }).join('');
}

function buildAnalysis(exp, comp, checkRes) {
  const zh = state.lang === 'zh';
  const ok = comp.results.filter((r) => r.ok);
  const highlights = comp.results.filter((r) => r.ok && r.highlight);
  const shown = (highlights.length ? highlights : ok.slice(0, 3));
  const dev = comp.results.find((r) => r.ok && /relErr|deviation/i.test(r.key));
  const relU = comp.results.find((r) => r.ok && /^uRel$/i.test(r.key));
  const absU = comp.results.find((r) => r.ok && /^ug$/i.test(r.key));
  const items = shown.map((r) => r.symbol + ' = ' + r.display + (r.unit ? ' ' + r.unit : '')).join('；');
  const errs = checkRes.issues.filter((i) => i.level === 'error');
  const warns = checkRes.issues.filter((i) => i.level === 'warn');
  const paras = [];
  const executed = checkRes.passed.length + checkRes.issues.length;
  const failed = comp.results.filter((r) => !r.ok);
  if (failed.length) {
    paras.push('<p>' + failed.map((r) => '[' + fill(t('report.missingData'), { field: L(r.label) }) + ']').join(' ') + '</p>');
  }
  if (zh) {
    paras.push('<p>依据实验原理所列公式，将基础测量数据逐项代入，得到主要计算结果：' + esc(items) + '。全部中间量与结果均由配置的公式依赖关系自动求解，计算过程见对应的公式展开。</p>');
    if (dev) {
      const dv = Math.abs(Number(dev.value));
      const judge = dv < 5 ? '属正常实验误差范围' : dv < 15 ? '偏大，需检查仪器校准与量程设置' : '过大，应检查接线、单位换算与原理理解';
      paras.push('<p>' + (exp.id === 'am' ? '调幅指数与目标值的相对偏差为 ' : '计算结果与参考值的相对偏差为 ') + esc(dev.display) + '%，' + esc(judge) + '。按误差分析五步法，偏差小于 5% 时可认为测量结果与理论模型一致。</p>');
    }
    if (relU) {
      paras.push('<p>相对合成不确定度为 ' + esc(relU.display) + '%' + (absU ? '，绝对不确定度为 ' + esc(absU.display) + ' ' + esc(absU.unit) : '') + '。不确定度主要来自仪器分辨力与读数分散性，建议在报告中给出完整的结果表达式。</p>');
    }
    paras.push('<p>系统共执行 ' + executed + ' 条校验规则，通过 ' + checkRes.passed.length + ' 条，' + (errs.length ? '存在 ' + errs.length + ' 项需处理的错误' : '无阻断性错误') + (warns.length ? '，' + warns.length + ' 项建议核对' : '') + '。' +
      (checkRes.issues.length ? '需关注：' + esc(checkRes.issues.slice(0, 3).map((i) => i.title).join('、')) + '。' : '数据与公式自洽，可提交。') + '</p>');
  } else {
    paras.push('<p>Substituting the base measurements into the configured formulas gives: ' + esc(items) + '. All intermediate and derived quantities were solved automatically in dependency order; the working for each result is shown in the formula panel. Intermediate values retain the configured significant figures at every step, so the whole calculation is reproducible from the data table alone.</p>');
    if (dev) {
      const dv = Math.abs(Number(dev.value));
      const judge = dv < 5 ? 'within the normal experimental error' : dv < 15 ? 'rather large; check instrument calibration and range settings' : 'excessive; check wiring, unit conversion, and understanding of the principle';
      paras.push('<p>' + (exp.id === 'am' ? 'The deviation from the target modulation index is ' : 'The relative deviation from the reference is ') + esc(dev.display) + '%, which is ' + esc(judge) + '. Deviations below 5% are generally regarded as agreement with theory.</p>');
    }
    if (relU) {
      paras.push('<p>The relative combined uncertainty is ' + esc(relU.display) + '%' + (absU ? ', with an absolute uncertainty of ' + esc(absU.display) + ' ' + esc(absU.unit) : '') + '. It is dominated by instrument resolution and reading dispersion; report the complete result expression.</p>');
    }
    paras.push('<p>' + executed + ' validation rules were executed: ' + checkRes.passed.length + ' passed, ' + errs.length + ' error(s), and ' + warns.length + ' warning(s). ' +
      (checkRes.issues.length ? 'Items to review: ' + esc(checkRes.issues.slice(0, 3).map((i) => i.title).join(', ')) + '.' : 'The data are self-consistent and ready for submission.') + '</p>');
  }
  return paras.join('');
}

function buildSymbolTable(exp) {
  const syms = SYMBOLS[exp.id];
  if (!syms || !syms.length) return '';
  return rpTable(t('report.section.symbols'),

}

function buildCalcSteps(exp, comp) {
  const rows = comp.results.filter((r) => r.ok && (r.highlight || /relErr|^uRel$|^ug$|^Q$|^Y$|^R$|^n$|^lambda$|^I1$|^f$/i.test(r.key))).slice(0, 6);
  if (!rows.length) return '';
  return '<p class="rp-note">' + esc(t('report.calcLead')) + '</p><ol class="rp-steps">' +
    rows.map((r) => '<li><b>' + esc(L(r.label)) + '（' + esc(r.symbol) + '）</b>：' +
      '<span class="rp-formula" style="display:block;margin:5px 0 0">' + esc(r.substituted || r.exprText) + ' = ' + esc(r.display) + (r.unit ? ' ' + esc(r.unit) : '') + '</span></li>').join('') +
    '</ol>';
}

function buildErrorAnalysis(exp, comp, checkRes) {
  const zh = state.lang === 'zh';
  const dev = comp.results.find((r) => r.ok && /relErr/i.test(r.key));
  const relU = comp.results.find((r) => r.ok && /^uRel$/i.test(r.key));
  const absU = comp.results.find((r) => r.ok && /^ug$/i.test(r.key));
  const src = (zh ? exp.errorSources.zh : exp.errorSources.en) || [];
  const errs = checkRes.issues.filter((i) => i.level === 'error');
  const warns = checkRes.issues.filter((i) => i.level === 'warn');
  const parts = [];
  if (dev) {
    const d = Number(dev.value);
    const ad = Math.abs(d);
    const dir = d >= 0 ? (zh ? '偏大' : 'higher') : (zh ? '偏小' : 'lower');
    const judge = ad < 5 ? (zh ? '属正常实验误差范围' : 'within normal experimental error')
      : ad < 15 ? (zh ? '偏大，需要进一步排查' : 'rather large and needs investigation')
        : (zh ? '过大，说明存在明显的系统性问题' : 'excessive, indicating a systematic problem');
    parts.push('<p>' + (zh
      ? '本次结果相对偏差为 ' + esc(dev.display) + '%，' + esc(judge) + '。结果' + dir + '，从误差来源看，' + esc(src[0] || '仪器与读数误差') + '会直接导致这一方向的偏差，应作为首要排查对象。'
      : 'The relative deviation of this run is ' + esc(dev.display) + '%, ' + esc(judge) + '. The result is ' + dir + '; among the error sources, ' + esc(src[0] || 'instrument and reading errors') + ' acts in this direction and should be checked first.') + '</p>');
  } else {
    parts.push('<p>' + (zh ? '本实验未设置理论参考值，误差评价以测量分散性与仪器分辨力为主。' : 'No theoretical reference is defined; the error assessment relies on dispersion and instrument resolution.') + '</p>');
  }
  if (relU) {
    const hi = comp.results.find((r) => r.highlight);
    parts.push('<p>' + (zh
      ? '相对合成不确定度为 ' + esc(relU.display) + '%' + (absU ? '，绝对不确定度为 ' + esc(absU.display) + ' ' + esc(absU.unit) : '') + '，主要由仪器分辨力与重复测量的分散性贡献；最终结果应按「' + esc(hi ? hi.display : '—') + ' ± ' + esc(absU ? absU.display : '—') + (hi && hi.unit ? ' ' + esc(hi.unit) : '') + '」的形式表达。'
      : 'The relative combined uncertainty is ' + esc(relU.display) + '%' + (absU ? ', with an absolute uncertainty of ' + esc(absU.display) + ' ' + esc(absU.unit) : '') + ', dominated by instrument resolution and repeat-measurement dispersion. Express the final result as “best estimate ± uncertainty”.') + '</p>');
  }
  if (src.length > 1) {
    parts.push('<p>' + (zh ? '其他不可忽略的来源包括：' : 'Other non-negligible sources include: ') + esc(src.slice(1, 3).map((s) => String(s).replace(/[；;。.，,]+$/, '')).join(zh ? '；' : '; ')) + '。</p>');
  }
  if (!relU) {
    parts.push('<p>' + (zh
      ? '本实验未配置合成不确定度评定，误差量级以相对偏差与校验规则的判定为准。'
      : 'No combined-uncertainty budget is configured for this experiment; the error magnitude is judged from the relative deviation and the validation rules.') + '</p>');
  }
  parts.push('<p>' + (zh
    ? '从性质上区分：系统误差使结果持续偏向一侧，偶然误差使重复读数分散，下列来源已按此归类分析。'
    : 'Systematic effects shift the result persistently in one direction whereas random effects disperse repeated readings; the sources listed below are classified accordingly.') + '</p>');
  return parts.join('');
}

function buildDiscussion(exp, comp, checkRes) {
  const zh = state.lang === 'zh';
  const dev = comp.results.find((r) => r.ok && /relErr/i.test(r.key));
  const src = (zh ? exp.errorSources.zh : exp.errorSources.en) || [];
  const ad = dev ? Math.abs(Number(dev.value)) : null;
  const verdict = ad == null
    ? (zh ? '本实验以数据自洽性为主要判据，结果可用于后续分析' : 'data consistency is the main criterion and the result is usable')
    : ad < 5 ? (zh ? '结果与理论模型吻合良好' : 'the result agrees well with theory')
      : (zh ? '结果与理论值存在可辨偏差，需要结合误差来源解释' : 'a discernible deviation remains and must be explained');
  return '<p>' + esc(verdict) + '。' + esc(zh
    ? '若要进一步提高精度，建议：① 针对「' + (src[0] || '主要系统误差') + '」逐项复核；② 增加重复测量次数并采用逐差法处理；③ 在条件允许时换用分辨力更高的仪器。'
    : 'To improve accuracy: (1) re-check “' + (src[0] || 'the main systematic error') + '”; (2) increase repeats and use the difference method; (3) use instruments with higher resolution where possible.') + '</p>';
}

function detailList(exp, field) {
  const d = EXPERIMENT_DETAILS[exp.id];
  if (!d || !d[field]) return [];
  const v = d[field];
  return (state.lang === 'zh' ? v.zh : v.en) || [];
}

function buildPrincipleSection(exp, comp) {
  const zh = state.lang === 'zh';
  const formulas = (exp.formulas || []).map((f) => '<div class="rp-formula">' + esc(f) + '</div>').join('');
  const deriv = detailList(exp, 'derivations');
  const cond = detailList(exp, 'conditions');
  const symbols = buildSymbolTable(exp);
  const derivHtml = deriv.length
    ? '<p><b>' + esc(t('report.section.derivation')) + '</b></p><ol class="rp-steps">' + deriv.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ol>'
    : '';
  const condHtml = cond.length
    ? '<p><b>' + esc(t('report.section.conditions')) + '</b></p><ul>' + cond.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    : '';
  return '<p>' + esc(zh ? exp.principle.zh : exp.principle.en) + '</p>' +
    '<p><b>' + esc(t('report.formulaList')) + '</b></p>' + formulas + symbols + derivHtml + condHtml;
}

function buildInstrumentsSection(exp) {
  const list = state.lang === 'zh' ? exp.instruments.zh : exp.instruments.en;
  const rows = list.map((name, i) => {
    const m = String(name).match(/[（(]([^）)]+)[）)]/);
    return [String(i + 1), String(name), m ? m[1] : '—', '1'];
  });
  return rpTable(t('report.section.instruments'),
    [t('report.table.items'), t('report.instrument.item'), t('report.instrument.spec'), t('report.instrument.qty')],
    rows);
}

function buildStepsSection(exp) {
  const steps = (state.lang === 'zh' ? exp.steps.zh : exp.steps.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  const prec = detailList(exp, 'precautions');
  const precHtml = prec.length
    ? '<p><b>' + esc(t('report.section.precautions')) + '</b></p><ul>' + prec.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    : '';
  return '<ol class="rp-steps">' + steps + '</ol>' + precHtml;
}

function buildStatsSection(exp, comp) {
  const zh = state.lang === 'zh';
  const relU = comp.results.find((r) => r.ok && /^uRel$/i.test(r.key));
  const absU = comp.results.find((r) => r.ok && /^ug$/i.test(r.key));
  const mean = comp.results.find((r) => r.ok && /^mean$/i.test(r.key));
  const std = comp.results.find((r) => r.ok && /^(std|sigma)$/i.test(r.key));
  const uA = comp.results.find((r) => r.ok && /^uA$/i.test(r.key));
  const hi = comp.results.find((r) => r.highlight);
  const hasRepeat = !!(mean || std || uA);
  const parts = ['<p><b>' + esc(t('report.data.stats')) + '</b></p>'];
  parts.push('<p>' + esc(hasRepeat ? t('report.data.repeat') : t('report.data.single')) + '</p>');
  if (mean) parts.push('<p>' + (zh ? '平均值' : 'Mean') + '：' + esc(mean.display) + (mean.unit ? ' ' + esc(mean.unit) : '') + '</p>');
  if (std) parts.push('<p>' + (zh ? '标准差' : 'Standard deviation') + '：' + esc(std.display) + (std.unit ? ' ' + esc(std.unit) : '') + '</p>');
  if (relU) {
    parts.push('<p>' + (zh ? '相对合成不确定度' : 'Relative combined uncertainty') + '：' + esc(relU.display) + '%'
      + (absU ? '，' + (zh ? '绝对不确定度' : 'absolute uncertainty') + ' ' + esc(absU.display) + ' ' + esc(absU.unit) : '') + '。</p>');
  }
  if (hi && absU) {
    parts.push('<p>' + (zh ? '结果表达' : 'Result expression') + '：' + esc(hi.symbol) + ' = (' + esc(hi.display) + ' ± ' + esc(absU.display) + ')' + (hi.unit ? ' ' + esc(hi.unit) : '') + '。</p>');
  }
  parts.push('<p class="rp-note">' + esc(t('report.data.sig')) + '</p>');
  return parts.join('');
}

function buildErrorSection(exp, comp, checkRes) {
  const zh = state.lang === 'zh';
  const base = buildErrorAnalysis(exp, comp, checkRes);
  const dev = comp.results.find((r) => r.ok && /relErr/i.test(r.key));
  const relU = comp.results.find((r) => r.ok && /^uRel$/i.test(r.key));
  let magnitude = '';
  if (dev && relU && Number(relU.value) > 0) {
    const k = Math.abs(Number(dev.value)) / Number(relU.value);
    const text = k <= 1
      ? t('report.error.within')
      : fill(t('report.error.exceed'), { k: k.toFixed(1) });
    magnitude = '<p><b>' + esc(t('report.error.magnitude')) + '</b></p><p>' + esc(text) + '</p>';
  }
  const errors = (zh ? exp.errorSources.zh : exp.errorSources.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  return base + magnitude + '<ul>' + errors + '</ul>';
}

function buildConclusionSection(exp, comp) {
  const zh = state.lang === 'zh';
  const vars = reportVars(exp, comp);
  const conclusion = fill(L(exp.conclusion), vars);
  const dev = comp.results.find((r) => r.ok && /relErr/i.test(r.key));
  const hi = comp.results.find((r) => r.highlight);
  const absU = comp.results.find((r) => r.ok && /^ug$/i.test(r.key));
  const ad = dev ? Math.abs(Number(dev.value)) : null;
  const verdict = ad == null
    ? (zh ? '本实验未设置理论参考值，结果以数据自洽性为判据。' : 'No theoretical reference is set; consistency is the criterion.')
    : ad < 5 ? t('report.conclusion.qualified')
      : ad < 15 ? t('report.conclusion.marginal')
        : t('report.conclusion.unqualified');
  const parts = ['<p>' + esc(conclusion) + '</p>'];
  if (hi) {
    parts.push('<p><b>' + esc(t('report.conclusion.result')) + '</b>：' + esc(L(hi.label)) + ' ' + esc(hi.symbol) + ' = ' +
      esc(hi.display) + (absU ? ' ± ' + esc(absU.display) : '') + (hi.unit ? ' ' + esc(hi.unit) : '') + '</p>');
  }
  if (dev) {
    parts.push('<p><b>' + esc(t('report.conclusion.compare')) + '</b>：' + (zh ? '相对偏差 ' : 'relative deviation ') +
      esc(dev.display) + '%，' + esc(verdict) + '</p>');
  } else {
    parts.push('<p>' + esc(verdict) + '</p>');
  }
  return parts.join('');
}

function buildReferencesSection(exp) {
  const refs = detailList(exp, 'references');
  const src = L(exp.source);
  const list = refs.map((r) => '<li>' + esc(r) + '</li>').join('');
  return '<ol class="rp-steps">' + list + '</ol>' +
    (src ? '<p class="rp-note">' + esc(fill(t('report.sourceNote'), { source: src })) + '</p>' : '') +
    '<p class="rp-note">' + esc(t('report.ref.note')) + '</p>';
}

// 内容自检最低量（中文按汉字数，英文按字符数）
const AUDIT_MIN = {
  zh: { title: 30, objective: 60, principle: 400, instruments: 60, steps: 220, data: 140, calc: 140, processing: 220, error: 220, conclusion: 90, discussion: 80, questions: 60, original: 20, confirm: 20, references: 60 },
  en: { title: 60, objective: 180, principle: 1100, instruments: 160, steps: 600, data: 280, calc: 280, processing: 600, error: 650, conclusion: 240, discussion: 240, questions: 160, original: 40, confirm: 40, references: 160 }
};

function auditReportContent(content, tpl) {
  const minMap = AUDIT_MIN[state.lang] || AUDIT_MIN.zh;
  const secs = normalizeSections(tpl.sections).filter((s) => s.enabled !== false && content[s.key]);
  const items = secs.map((s) => {
    const chars = stripHtml(content[s.key] || '').replace(/\s+/g, ' ').length;
    const min = minMap[s.key] || 0;
    return { key: s.key, title: sectionTitle(s, tpl), chars: chars, min: min, ok: chars >= min };
  });
  const pass = items.filter((i) => i.ok).length;
  return { items: items, pass: pass, total: items.length };
}

function renderAuditBar(audit) {
  if (!audit || !audit.total) return '';
  const rows = audit.items.map((i) =>
    '<tr><td>' + esc(i.title) + '</td><td class="num" style="text-align:right">' + i.chars + '</td><td class="num" style="text-align:right">' + i.min + '</td>' +
    '<td><span class="badge-sm ' + (i.ok ? 'ok' : 'low') + '">' + esc(t(i.ok ? 'report.audit.ok' : 'report.audit.short')) + '</span></td></tr>'
  ).join('');
  return '<details class="report-audit no-print"><summary>' + esc(t('report.audit.title')) + ' · ' +
    esc(fill(t('report.audit.summary'), { pass: audit.pass, total: audit.total })) + ' · ' + esc(t('report.audit.expand')) +
    '</summary><table><thead><tr><th>' + esc(t('report.section.title')) + '</th><th style="text-align:right">' + esc(t('report.audit.chars')) + '</th><th style="text-align:right">' + esc(t('report.audit.min')) + '</th><th></th></tr></thead><tbody>' +
    rows + '</tbody></table></details>';
}

function renderReportPaper(exp, comp, checkRes) {
  const zh = state.lang === 'zh';
  const tpl = resolveTemplate(exp);
  const vars = reportVars(exp, comp);
  const m = state.meta;
  const date = m.date || nowStamp();
  const school = m.school || t('report.meta.schoolVal');
  const major = m.major || t('report.meta.majorVal');
  const className = m.className || t('report.meta.classVal');
  const student = m.student || '____________';
  const studentId = m.studentId || '____________';
  const instructor = m.instructor || '____________';
  const title = exp.title;
  const coverMeta = [
    [t('report.meta.school'), school],
    [t('report.meta.major'), major],
    [t('report.meta.class'), className],
    [t('report.meta.student'), student],
    [t('report.meta.studentId'), studentId],
    [t('report.meta.instructor'), instructor],
    [t('report.meta.date'), date],
    [t('common.version'), 'v' + (exp.version || '1.0.0')]
  ];
  const metaHtml = '<div class="rp-meta">' + coverMeta.map(([k, v]) => '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>').join('') + '</div>';

  const tplCols = (tpl.tableStyle && tpl.tableStyle.columns) || 0;
  const hideRemark = tplCols >= 4 && tplCols < 6;
  const baseRows = (exp.inputs || []).map((inp, i) => {
    const v = comp.scope[inp.key];
    const row = [String(i + 1), L(inp.label), inp.symbol || inp.key, isFinite(v) ? fmtNum(v, inp.sig || 3) : '—', inp.unit || '—', inp.constant ? (zh ? '常量' : 'constant') : ''];
    return hideRemark ? row.slice(0, 5) : row;
  });
  const derivedRows = comp.results.map((r, i) => {
    const row = [String(i + 1), L(r.label), r.symbol, r.ok ? r.display : '—', r.unit || '—', r.highlight ? (zh ? '主要结果' : 'key result') : ''];
    return hideRemark ? row.slice(0, 5) : row;
  });
  const baseHead = [t('report.table.items'), t('report.table.quantity'), t('report.table.symbol'), t('report.table.measured'), t('report.table.unit'), t('report.table.remark')];
  const derivedHead = [t('report.table.items'), t('report.table.quantity'), t('report.table.symbol'), t('report.table.result'), t('report.table.unit'), t('report.table.remark')];
  const tableBase = rpTable(t('report.table.base'), hideRemark ? baseHead.slice(0, 5) : baseHead, baseRows);
  const tableDerived = rpTable(t('report.table.derived'), hideRemark ? derivedHead.slice(0, 5) : derivedHead, derivedRows);

  const aims = (zh ? exp.aims.zh : exp.aims.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  const instruments = (zh ? exp.instruments.zh : exp.instruments.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  const steps = (zh ? exp.steps.zh : exp.steps.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  const questions = (zh ? exp.questions.zh : exp.questions.en).map((a) => '<li>' + esc(a) + '<div style="border-bottom:1px dotted #cfc9ba;height:16px;margin-top:4px"></div></li>').join('');
  const errors = (zh ? exp.errorSources.zh : exp.errorSources.en).map((a) => '<li>' + esc(a) + '</li>').join('');
  const formulas = (exp.formulas || []).map((f) => '<div class="rp-formula">' + esc(f) + '</div>').join('');
  const symbols = buildSymbolTable(exp);
  const conclusion = fill(L(exp.conclusion), vars);
  const analysis = buildAnalysis(exp, comp, checkRes);
  const calcSteps = buildCalcSteps(exp, comp);
  const errorAnalysis = buildErrorAnalysis(exp, comp, checkRes);
  const discussion = buildDiscussion(exp, comp, checkRes);

  const checklist = [
    t('report.checklist.original'), t('report.checklist.image'), t('report.checklist.error'), t('report.checklist.unit'), t('report.checklist.sign')
  ].map((c) => '<li><span class="box"></span><span>' + esc(c) + '</span></li>').join('');

  const imageBlock = state.ocr.image
    ? '<div style="margin:10px 0"><div class="rp-note">' + esc(zh ? '附件：手绘数据表照片' : 'Attachment: photograph of the handwritten data sheet') + '</div><img src="' + state.ocr.image + '" style="max-width:100%;max-height:220px;border:1px solid #cfc9ba;border-radius:3px;display:block"></div>'
    : '<p class="rp-note">' + esc(zh ? '未上传照片，请在此处粘贴原始记录复印件或手写表格照片。' : 'No photograph uploaded. Paste the original record or handwritten sheet here.') + '</p>';

  const sign = '<div class="rp-sign">' +
    '<div class="line-wrap"><span>' + esc(t('report.sign.student')) + '</span><span class="line"></span></div>' +
    '<div class="line-wrap"><span>' + esc(t('report.sign.instructor')) + '</span><span class="line"></span></div>' +
    '<div class="line-wrap" style="flex:0 0 150px"><span>' + esc(t('report.sign.date')) + '</span><span class="line"></span></div>' +
  '</div>';

  const head = '<div class="rp-cover">' +
    '<div class="rp-school">' + esc(school) + '</div>' +
    '<h1>' + esc(L(title)) + '</h1>' +
    '<div class="sub">' + esc(zh ? title.en : title.zh) + '</div>' +
    '<div class="rp-note" style="margin-top:6px">' + esc(zh ? (t('report.meta.course') + ' · ' + t('report.meta.courseEn')) : t('report.meta.courseEn')) + '</div>' +
    metaHtml +
  '</div>';

  const content = {
    title: '<p><b>' + esc(zh ? title.zh : title.en) + '</b>（' + esc(zh ? title.en : title.zh) + '）</p>' +
      '<p class="rp-note">' + esc(fill(t('report.templateNote'), { name: L(tpl.name) })) + ' · ' + esc(fill(t('report.sourceNote'), { source: t(sourceTypeOf(exp) === 'extension' ? 'source.extension' : 'source.manual') })) + '</p>',
    objective: buildObjectiveSection(exp, comp),
    principle: buildPrincipleSection(exp, comp),
    instruments: buildInstrumentsSection(exp),
    steps: buildStepsSection(exp),
    data: tableBase + tableDerived,
    calc: calcSteps + buildStatsSection(exp, comp),
    processing: analysis + '<p class="rp-note">' + esc(t('report.gen.auto')) + '</p>',
    error: buildErrorSection(exp, comp, checkRes),
    conclusion: buildConclusionSection(exp, comp),
    discussion: discussion,
    questions: buildQnaSection(exp, comp),
    original: imageBlock,
    confirm: '<ul class="rp-checklist">' + checklist + '</ul>',
    references: buildReferencesSection(exp)
  };

  const sections = normalizeSections(tpl.sections).filter((s) => s.enabled !== false && content[s.key]);
  state.lastAudit = auditReportContent(content, tpl);
  let num = 0;
  const body = sections.map((sec) => {
    num++;
    return '<section class="rp-section"><h2><span class="num">' + String(num).padStart(2, '0') + '</span>' + esc(sectionTitle(sec, tpl)) + '</h2>' + content[sec.key] + '</section>';
  }).join('');

  return '<article class="report-paper" id="reportPaper">' + head + body + sign + '</article>';
}

  const m = state.meta;
  const lines = [];
  const H = (s) => { lines.push('## ' + s); lines.push(''); };
  const P = (s) => { lines.push(s || ''); lines.push(''); };
  const list = (arr) => { arr.forEach((a, i) => lines.push((i + 1) + '. ' + a)); lines.push(''); };

  lines.push('# ' + L(exp.title));
  lines.push('');
  lines.push('> ' + (zh ? exp.title.en : exp.title.zh));
  lines.push('');
  lines.push('| ' + (zh ? '项目' : 'Item') + ' | ' + (zh ? '内容' : 'Value') + ' |');
  lines.push('| --- | --- |');
  lines.push('| ' + t('report.meta.school') + ' | ' + esc(m.school || t('report.meta.schoolVal')) + ' |');
  lines.push('| ' + t('report.meta.major') + ' | ' + esc(m.major || t('report.meta.majorVal')) + ' |');
  lines.push('| ' + t('report.meta.class') + ' | ' + esc(m.className || t('report.meta.classVal')) + ' |');
  lines.push('| ' + t('report.meta.student') + ' | ' + esc(m.student || '—') + ' |');
  lines.push('| ' + t('report.meta.studentId') + ' | ' + esc(m.studentId || '—') + ' |');
  lines.push('| ' + t('report.meta.date') + ' | ' + esc(m.date || nowStamp()) + ' |');
  lines.push('');

  H(t('report.section.objective'));
  P(stripHtml(buildObjectiveSection(exp, comp)));

  H(t('report.section.principle'));
  P(zh ? exp.principle.zh : exp.principle.en);
  lines.push('```');
  (exp.formulas || []).forEach((f) => lines.push(f));
  lines.push('```');
  lines.push('');
  const derivs = detailList(exp, 'derivations');
  if (derivs.length) {
    lines.push('**' + t('report.section.derivation') + '**');
    lines.push('');
    list(derivs);
  }
  const conds = detailList(exp, 'conditions');
  if (conds.length) {
    lines.push('**' + t('report.section.conditions') + '**');
    lines.push('');
    conds.forEach((c) => lines.push('- ' + c));
    lines.push('');
  }
  const syms = SYMBOLS[exp.id] || [];
  if (syms.length) {
    lines.push('**' + t('report.section.symbols') + '**');
    lines.push('');
    lines.push('| ' + t('report.symbol') + ' | ' + t('report.meaning') + ' | ' + t('report.unit') + ' |');
    lines.push('| --- | --- | --- |');
    syms.forEach((s) => lines.push('| ' + s.s + ' | ' + (zh ? s.zh : s.en) + ' | ' + (s.u || '—') + ' |'));
    lines.push('');
  }

  H(t('report.section.instruments'));
  lines.push('| ' + t('report.table.items') + ' | ' + t('report.instrument.item') + ' | ' + t('report.instrument.spec') + ' | ' + t('report.instrument.qty') + ' |');
  lines.push('| --- | --- | --- | --- |');
  (zh ? exp.instruments.zh : exp.instruments.en).forEach((name, i) => {
    const mm = String(name).match(/[（(]([^）)]+)[）)]/);
    lines.push('| ' + (i + 1) + ' | ' + name + ' | ' + (mm ? mm[1] : '—') + ' | 1 |');
  });

  list(zh ? exp.steps.zh : exp.steps.en);

  if (prec.length) {
    lines.push('**' + t('report.section.precautions') + '**');
    lines.push('');
    prec.forEach((p) => lines.push('- ' + p));
    lines.push('');

  lines.push('### ' + t('report.table.base'));
  lines.push('| ' + t('report.table.items') + ' | ' + t('report.table.quantity') + ' | ' + t('report.table.symbol') + ' | ' + t('report.table.measured') + ' | ' + t('report.table.unit') + ' | ' + t('report.table.remark') + ' |');

    lines.push('| ' + (i + 1) + ' | ' + L(inp.label) + ' | ' + (inp.symbol || inp.key) + ' | ' + (isFinite(v) ? fmtNum(v, inp.sig || 3) : '—') + ' | ' + (inp.unit || '—') + ' | ' + (inp.constant ? (zh ? '常量' : 'constant') : '') + ' |');

  lines.push('### ' + t('report.table.derived'));

    lines.push('| ' + (i + 1) + ' | ' + L(r.label) + ' | ' + r.symbol + ' | ' + (r.ok ? r.display : '—') + ' | ' + (r.unit || '—') + ' | ' + (r.highlight ? (zh ? '主要结果' : 'key result') : '') + ' |');
  });
  lines.push('');

  H(t('report.section.calc'));
  const calcRows = comp.results.filter((r) => r.ok && (r.highlight || /relErr|^uRel$|^ug$|^Q$|^Y$|^R$|^n$|^lambda$|^I1$|^f$/i.test(r.key))).slice(0, 6);
  calcRows.forEach((r, i) => {
    lines.push((i + 1) + '. **' + L(r.label) + '（' + r.symbol + '）**：' + (r.substituted || r.exprText) + ' = ' + r.display + (r.unit ? ' ' + r.unit : ''));
  });
  lines.push('');
  P(stripHtml(buildStatsSection(exp, comp)));

  H(t('report.section.processing'));
  P(stripHtml(buildAnalysis(exp, comp, checkRes)));

  H(t('report.section.error'));
  P(stripHtml(buildErrorSection(exp, comp, checkRes)));

  H(t('report.section.conclusion'));
  P(stripHtml(buildConclusionSection(exp, comp)));

  H(t('report.section.discussion'));
  P(stripHtml(buildDiscussion(exp, comp, checkRes)));

  H(t('report.section.questions'));
  P(stripHtml(buildQnaSection(exp, comp)));

  H(t('report.section.references'));
  list(detailList(exp, 'references'));
  const src = L(exp.source);
  if (src) P('> ' + fill(t('report.sourceNote'), { source: src }));

  H(t('report.section.confirm'));
  [t('report.checklist.original'), t('report.checklist.image'), t('report.checklist.error'), t('report.checklist.unit'), t('report.checklist.sign')].forEach((c) => lines.push('- [ ] ' + c));
  lines.push('');
  lines.push('---');
  lines.push(t('report.gen.auto'));
  return lines.join('\n');
}

function stripHtml(html) {
  return String(html).replace(/<li>/g, '- ').replace(/<\/p>/g, '\n\n').replace(/<[^>]+>/g, '').replace(/\n{3,}/g, '\n\n').trim();
}

function exportReport(kind) {
  const exp = currentExperiment();
  if (!exp) return toast(t('toast.selectExp'), 'warn');
  const comp = computeExperiment(exp, state.values);
  const res = runChecks(exp, comp.scope);
  if (!state.values || !Object.keys(state.values).length) return toast(t('toast.noData'), 'warn');

  if (kind === 'pdf') {
    toast(t('report.printHint'), 'ok');
    setTimeout(() => window.print(), 320);
  } else if (kind === 'md') {
    download(fname + '.md', reportMarkdown(exp, comp, res), 'text/markdown;charset=utf-8');
    toast(t('report.downloadOk'), 'ok');
  } else if (kind === 'html') {
    download(fname + '.html', reportHtmlDocument(exp, comp, res), 'text/html;charset=utf-8');

function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast(t('report.copyOk'), 'ok');
  } catch (e) { toast(t('report.copyFail'), 'err'); }
}

function seedValues(exp) {
  state.values = {};
  state.rawValues = {};
  (exp.inputs || []).forEach((inp) => {
    state.values[inp.key] = inp.value;
    state.rawValues[inp.key] = String(inp.value);
  });
}
function selectExperiment(id, autoStep) {
  const exp = allExperiments().find((e) => e.id === id);
  if (!exp) return;
  const changed = state.experimentId !== id;
  state.experimentId = id;
  if (changed) {
    seedValues(exp);
    state.ocr = { image: null, fileName: '', recognized: false, cells: [], busy: false, manualMode: false };
    state.ui.formulaOpen = {};
  } else if (!Object.keys(state.values).length) {
    seedValues(exp);
  }
  state.step = autoStep || 1;
  persist();
  render();
}
function updateValue(key, raw, live) {
  state.rawValues[key] = raw;
  state.values[key] = (raw === '' || raw === '-') ? '' : Number(raw);
  persist();
  if (live) refreshLive();
}
function refreshLive() {
  const exp = currentExperiment();
  if (!exp) return;
  const comp = computeExperiment(exp, state.values);
  const res = runChecks(exp, comp.scope);
  comp.results.forEach((r) => {
    const el = document.querySelector('[data-live-result="' + r.key + '"]');

  const note = $('#calcLiveNote');

// ---------- 统一图片上传适配层（Web 优先，兼容小程序迁移） ----------
// 前置校验 → 自动压缩 → multipart 上传；错误分类：format / too_large /
// missing / compress / network / server。小程序端替换 compress+upload 两个
// 方法为 wx.compressImage + wx.uploadFile 即可，接口签名保持一致。
const UPLOAD_LIMITS = {
  formats: ['png', 'jpg', 'jpeg', 'webp'],
  maxOriginalMB: 6,
  targetMB: 2,
  maxEdge: 1920
};
const UPLOAD_ERROR = {
  FORMAT: 'format',
  TOO_LARGE: 'too_large',
  MISSING: 'missing',
  COMPRESS: 'compress',
  NETWORK: 'network',
  SERVER: 'server'
};

function fmtKB(kb) {
  kb = Number(kb) || 0;
  return kb >= 1024 ? (kb / 1024).toFixed(1) + 'MB' : Math.round(kb) + 'KB';
}

const UploadClient = {
  endpoint: null,
  setEndpoint(url) { this.endpoint = url || null; },
  extOf(name) {
    const m = String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/);
    return m ? m[1] : '';
  },
  validate(meta) {
    const missing = [];
    if (!meta.experimentId) missing.push('experimentId');
    if (!meta.language) missing.push('language');
    if (!meta.mode) missing.push('mode');
    if (!meta.imagePath && !meta.file) missing.push('imagePath');
    if (missing.length) return { ok: false, code: UPLOAD_ERROR.MISSING, fields: missing };
    const ext = this.extOf(meta.fileName || (meta.imagePath || ''));
    if (UPLOAD_LIMITS.formats.indexOf(ext) < 0) return { ok: false, code: UPLOAD_ERROR.FORMAT, ext: ext || '?' };
    return { ok: true };
  },
  loadImageEl(src) {
    return new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('decode-failed'));
      i.src = src;
    });
  },
  drawToBlob(img, w, h, q) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return new Promise((resolve) => c.toBlob((b) => resolve(b), 'image/jpeg', q));
  },
  async compress(file) {
    const url = URL.createObjectURL(file);
    let img;
    try {
      img = await this.loadImageEl(url);
    } finally {
      URL.revokeObjectURL(url);
    }
    let w = img.width, h = img.height;
    const scale = Math.min(1, UPLOAD_LIMITS.maxEdge / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    let quality = 0.9;
    let blob = null;
    for (let i = 0; i < 8; i++) {
      blob = await this.drawToBlob(img, w, h, quality);
      if (blob && blob.size <= UPLOAD_LIMITS.targetMB * 1024 * 1024) break;
      if (quality > 0.4) quality -= 0.15;
      else if (Math.max(w, h) > 960) {
        w = Math.round(w * 0.85);
        h = Math.round(h * 0.85);
        quality = 0.75;
      } else break;
    }
    if (!blob || blob.size <= 0) throw new Error(UPLOAD_ERROR.COMPRESS);
    return { blob: blob, width: w, height: h, quality: quality };
  },
  blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('read-failed'));
      r.readAsDataURL(blob);
    });
  },
  async upload(prepared, meta) {
    if (!this.endpoint) return { ok: true, local: true };
    const fd = new FormData();
    fd.append('imagePath', prepared.blob, meta.fileName || 'capture.jpg');
    fd.append('experimentId', meta.experimentId);
    fd.append('language', meta.language);
    fd.append('mode', meta.mode);
    let resp;
    try {
      resp = await fetch(this.endpoint, { method: 'POST', body: fd });
    } catch (e) {
      return { ok: false, code: UPLOAD_ERROR.NETWORK, message: e && e.message };
    }
    if (!resp.ok) {
      const msg = await resp.text().catch(() => '');
      return { ok: false, code: UPLOAD_ERROR.SERVER, status: resp.status, message: String(msg).slice(0, 160) };
    }
    const data = await resp.json().catch(() => ({}));
    return { ok: true, local: false, data: data };
  },
  async prepareAndUpload(file, metaOverride) {
    const meta = Object.assign({
      experimentId: state.experimentId,
      language: state.lang,
      mode: 'handwritten-table',
      fileName: (file && file.name) || ''
    }, metaOverride || {});
    meta.file = file;
    if (metaOverride && metaOverride.fileName && !/\.([a-z0-9]+)$/i.test(meta.fileName || '')) {
      meta.fileName = metaOverride.fileName;
    }
    const v = this.validate(meta);
    if (!v.ok) return v;
    const originalKB = file.size / 1024;
    let prepared;
    try {
      prepared = await this.compress(file);
    } catch (e) {
      return { ok: false, code: UPLOAD_ERROR.COMPRESS };
    }
    if (prepared.blob.size > UPLOAD_LIMITS.targetMB * 1024 * 1024) {
      return { ok: false, code: UPLOAD_ERROR.TOO_LARGE, sizeKB: Math.round(prepared.blob.size / 1024) };
    }
    const up = await this.upload(prepared, meta);
    if (!up.ok) return up;
    const dataUrl = await this.blobToDataURL(prepared.blob);
    const sizeKB = prepared.blob.size / 1024;
    return {
      ok: true,
      local: up.local,
      serverData: up.data,
      dataUrl: dataUrl,
      objectUrl: URL.createObjectURL(prepared.blob),
      sizeKB: Math.round(sizeKB),
      originalKB: Math.round(originalKB),
      width: prepared.width,
      height: prepared.height,
      compressed: sizeKB < originalKB * 0.95
    };
  }
};

function uploadErrorMessage(r) {
  if (!r) return t('toast.error');
  switch (r.code) {
    case UPLOAD_ERROR.FORMAT: return fill(t('upload.err.format'), { ext: r.ext || '?' });
    case UPLOAD_ERROR.TOO_LARGE: return t('upload.err.tooLarge');
    case UPLOAD_ERROR.MISSING: return fill(t('upload.err.missing'), { fields: (r.fields || []).join(', ') });
    case UPLOAD_ERROR.COMPRESS: return t('upload.err.compress');
    case UPLOAD_ERROR.NETWORK: return t('upload.err.network');
    case UPLOAD_ERROR.SERVER: return fill(t('upload.err.server'), { status: r.status || '—', msg: r.message || '' });
    default: return t('toast.error');
  }
}

async function processImageFile(file, fallbackName) {
  if (!file) return;
  const override = {};
  if (fallbackName) override.fileName = fallbackName;
  const result = await UploadClient.prepareAndUpload(file, override);
  if (!result.ok) {
    toast(uploadErrorMessage(result), 'err');
    return;
  }
  if (result.compressed) {
    toast(fill(t('upload.compressed'), { from: fmtKB(result.originalKB), to: fmtKB(result.sizeKB) }), 'ok');
  }
  applyImage(result.dataUrl, (file && file.name) || fallbackName || 'capture.jpg', {
    sizeKB: result.sizeKB,
    originalKB: result.originalKB,
    width: result.width,
    height: result.height,
    compressed: result.compressed,
    local: result.local
  });
}

function applyImage(dataUrl, fileName, info) {
  state.ocr.image = dataUrl;
  state.ocr.fileName = fileName || 'capture.jpg';
  state.ocr.imageInfo = info || null;
  state.ocr.recognized = false;
  state.ocr.manualMode = false;
  state.ocr.cells = [];
  state.ui.formulaOpen = {};
  render({ keepScroll: true });
  toast(t('toast.imageLoaded'), 'ok');
}

function generateDemoImage() {
  const exp = currentExperiment();
  const W = 980, H = 720;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fffdf4';
  ctx.fillRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, 'rgba(180,83,9,.045)');
  grad.addColorStop(1, 'rgba(22,48,92,.05)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(-0.008);
  ctx.translate(-W / 2, -H / 2);

  ctx.strokeStyle = 'rgba(22,48,92,.16)';
  ctx.lineWidth = 1;
  for (let y = 60; y < H; y += 34) {
    ctx.beginPath();
    ctx.moveTo(70, y);
    ctx.lineTo(W - 70, y + (Math.random() - 0.5) * 1.5);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(180,83,9,.28)';
  ctx.beginPath();
  ctx.moveTo(112, 46);
  ctx.lineTo(112, H - 46);
  ctx.stroke();

  ctx.fillStyle = '#1d2939';
  ctx.font = 'italic 30px "Comic Sans MS", "Segoe UI", cursive';
  ctx.fillText(state.lang === 'zh' ? '物理实验原始数据记录' : 'LAB RAW DATA SHEET', 148, 118);
  ctx.font = 'italic 20px "Comic Sans MS", "Segoe UI", cursive';
  ctx.fillStyle = '#475467';
  ctx.fillText(L(exp.title), 150, 158);
  ctx.font = '16px "Segoe UI", sans-serif';
  ctx.fillStyle = '#98a2b3';
  ctx.fillText((state.lang === 'zh' ? '姓名：___________   班级：EE 2503   日期：' : 'Name: ___________   Class: EE 2503   Date: ') + nowStamp(), 150, 190);

  const left = 150, top = 232, colW = [80, 300, 250, 140];
  const rows = Math.min((exp.inputs || []).length, 8);
  const rowH = Math.min(58, Math.floor((H - 330) / Math.max(rows, 1)));
  const heads = state.lang === 'zh' ? ['序号', '物理量', '测量值', '单位'] : ['No.', 'Quantity', 'Measured', 'Unit'];
  ctx.strokeStyle = '#344054';
  ctx.lineWidth = 2;
  for (let r = 0; r <= rows + 1; r++) {
    const y = top + r * rowH;
    ctx.beginPath();
    ctx.moveTo(left, y + (r < rows + 1 ? (Math.random() - 0.5) * 2.5 : 0));
    ctx.lineTo(left + colW[0] + colW[1] + colW[2] + colW[3], y + (Math.random() - 0.5) * 2.5);
    ctx.stroke();
  }
  let x = left;
  for (let c2 = 0; c2 <= 4; c2++) {
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x + (Math.random() - 0.5) * 2, top + (rows + 1) * rowH);
    ctx.stroke();
    if (c2 < 4) x += colW[c2];
  }
  ctx.fillStyle = '#1d2939';
  ctx.font = 'bold 19px "Segoe UI", "PingFang SC", sans-serif';
  let hx = left;
  heads.forEach((h, i) => { ctx.fillText(h, hx + 12, top + rowH * 0.66); hx += colW[i]; });
  ctx.font = 'italic 23px "Comic Sans MS", "Segoe UI", cursive';
  ctx.fillStyle = '#16305c';
  (exp.inputs || []).slice(0, rows).forEach((inp, i) => {
    const y = top + (i + 1) * rowH + rowH * 0.64;
    let cx = left + 14;
    ctx.fillText(String(i + 1), cx, y);
    cx += colW[0];
    ctx.font = 'italic 19px "Comic Sans MS", "Segoe UI", cursive';
    ctx.fillText(L(inp.label).slice(0, 22), cx, y);
    cx += colW[1];
    ctx.font = 'italic 23px "Comic Sans MS", "Segoe UI", cursive';
    const raw = inp.value;
    ctx.fillText(String(raw), cx + 16, y + (Math.random() - 0.5) * 2);
    cx += colW[2];
    ctx.font = 'italic 17px "Comic Sans MS", "Segoe UI", cursive';
    ctx.fillStyle = '#475467';
    ctx.fillText(inp.unit || '—', cx + 12, y);
    ctx.fillStyle = '#16305c';
  });
  ctx.fillStyle = '#98a2b3';
  ctx.font = '14px "Segoe UI", sans-serif';
  ctx.fillText(state.lang === 'zh' ? '※ 本图为演示用生成样例，用于验证识别结果映射流程。' : 'Generated sample for demonstrating the recognition pipeline.', 150, H - 58);
  ctx.restore();
  applyImage(c.toDataURL('image/png'), 'sample-data-sheet.png');
}

async function startOcr() {
  const exp = currentExperiment();
  if (!exp) return;
  if (!state.ocr.image) return toast(t('upload.needImage'), 'warn');
  state.ocr.busy = true;
  state.ocr.recognized = false;
  state.ocr.manualMode = false;
  render({ keepScroll: true });
  let p = 12;
  const timer = setInterval(() => {
    p = Math.min(88, p + 7 + Math.random() * 9);
    const bar = $('#ocrProgress');
    if (bar) bar.style.width = p + '%';
  }, 180);
  try {
    const out = await OCR.recognize(state.ocr.image, exp);
    clearInterval(timer);
    const cells = (out && out.cells) || [];
    state.ocr.cells = cells;
    cells.forEach((c) => {
      if (c.key === undefined) return;
      state.values[c.key] = c.value !== undefined ? c.value : c.raw;
      state.rawValues[c.key] = c.raw !== undefined ? String(c.raw) : String(c.value);
    });
    state.ocr.busy = false;
    state.ocr.recognized = true;
    persist();
    render({ keepScroll: true });
    toast(t('upload.ocrDone'), 'ok');
  } catch (e) {
    clearInterval(timer);
    state.ocr.busy = false;
    render({ keepScroll: true });
    toast(t('upload.ocrFail'), 'err');
  }
}
